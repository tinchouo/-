# =====================================================================
#  AGUJERO DEL INFIERNO 2.0        despues de cambiar algo: /tod4eventos:agujero recargar
#
#  1) /tod4eventos:agujero crear         crea la cueva (su propio mundo). /tod4eventos:agujero tp para ir.
#  2) Decorala en CREATIVO: cada bloque que pongas o rompas queda guardado solo (la reconstruccion lo respeta).
#     (si editas con WorldEdit: /tod4eventos:agujero foto, con la cueva recien abierta)
#  3) /tod4eventos:agujero entrada 1 / entrada 2        mirando las dos puntas de la entrada (afuera)
#     /tod4eventos:agujero bloquesalida 1 / 2           mirando las dos puntas de la salida (adentro)
#     /tod4eventos:agujero salida         parado donde aparecen los que suben.
#     /tod4eventos:agujero llegada        (opcional) parado en la sala de entrada, donde aparecen al bajar.
#     /tod4eventos:agujero ver            muestra las zonas y los lugares de cofre con particulas
#  Cofres: en creativo, pone un COFRE (facil) o un COFRE TRAMPA (dificil) donde quieras uno. Romperlo saca el lugar.
#  Items propios para el loot: /tod4eventos:agujero item <nombre> con el item en la mano (los del loot del Aether,
#  como "chip", ya se pueden usar por su nombre; y los de Oraxen tambien: "tinchoin" busca el de Oraxen con ese id).
#  Otros: abrir (reconstruye y abre ya), cerrar [min], terminar (corta la corrida), espera <jugador>, estado
#  Los jugadores no pueden romper ni poner nada, ni usar perlas ni cargas de viento.
# =====================================================================
version: 5

mundo: agujero_infierno
# la forma de la cueva sale de esta semilla (cambiarla despues de crearla cambia solo lo que se genere de nuevo)
semilla: 2026
# bioma de toda la cueva (sonidos y niebla): dripstone_caves, deep_dark, lush_caves, basalt_deltas...
bioma: dripstone_caves

# la "linea": salir de la sala de entrada (radio en bloques desde el medio de la sala). Adentro de la sala no pasa nada.
linea_radio: 8.5

# lo que dura la cancion (segundos): mientras suena se derrumba (la cancion dura 3:09 con el final que se apaga)
duracion_seg: 180
# cuando termina: espera estos segundos y despues a los que siguen pasando la linea les saca "dano" cada medio segundo
espera_dano_seg: 3
# 3 = un corazon y medio, fijo (la armadura no lo baja). Cada medio segundo.
dano: 3.0
# cuando ya no queda nadie pasando la linea aparece una pared en la linea y queda derrumbada esto (minutos);
# mientras, no se puede bajar ("La cueva está derrumbada."). Despues se reconstruye sola y se avisa en el chat.
cerrado_min: 30
# cada jugador puede bajar una vez cada tanto (minutos). 0 = sin espera (puede bajar siempre que este abierta).
espera_jugador_min: 0

# la musica (sonido del pack) y su volumen. La escuchan todos los que estan en el mundo de la cueva.
musica: "tod4:agujero"
musica_volumen: 1.0

# arriba (donde dice "Wither") sale solo el tiempo. La barra es de este color; con el pack, la barra
# de este color es invisible (texturas boss_bar/white_background.png y white_progress.png transparentes).
barra_color: WHITE

# piedras que caen del techo cerca de cada jugador (por segundo): pocas al principio, van subiendo hasta "medio",
# y en los ultimos final_seg segundos caen muchas (por_segundo_final), con temblor y ruido.
# final_se_rompen: % de las del final que se rompen al caer (si no, tapan todos los tuneles). punta_chance: % de estalactitas (pegan fuerte)
derrumbe:
  por_segundo_inicio: 0.3
  por_segundo_medio: 2
  final_seg: 30
  por_segundo_final: 14
  final_se_rompen: 70
  punta_chance: 30

# los cofres van en los lugares que pusiste vos (en creativo: cofre = facil, cofre trampa = dificil).
# En cada reconstruccion sale este % de los lugares de cada tipo (siempre esa cantidad, en lugares al azar):
# por ejemplo con 10 lugares dificiles y 70, salen 7.
# generados: true = ademas usa lugares de la cueva generada, y entonces pone esta cantidad de cada tipo, al azar.
cofres:
  salen_facil: 50
  salen_dificil: 50
  generados: false
  facil: 8
  dificil: 5

# lo que tiene cada cofre:  "<item> <cantidad> [chance%]"   cantidad: 3  |  2-5  |  1:45,2:35,3:12 (1 con peso 45, 2 con 35...)
#   item: minecraft:x, oraxen:x, o un nombre guardado. Cada renglon sale o no por su cuenta (como un cofre comun:
#   con lugares vacios). Monedas: Trucoin (oraxen:moneda) vale 1, Frackoin (oraxen:moneda_roja) 10, Tinchoin (oraxen:moneda_morada) 100.
loot:
  # los cofres "petes": unas pocas monedas, restos de netherite, totems, engranajes, comida y corazones
  facil:
    - "oraxen:moneda 0:1,1:2,2:2,3:1"      # 0 a 3 Trucoin (en promedio 1,5)
    - "oraxen:totem_cuy 1:1,2:1 50%"       # lo mejor del cofre facil: 50%, y la mitad de las veces salen 2
    - "minecraft:netherite_scrap 0:30,1:45,2:25"   # 0, 1 o 2 restos de netherite (lo mas comun: 1)
    - "oraxen:iron_cog 1-3 60%"
    - "oraxen:gold_cog 1 30%"
    - "minecraft:bread 2-5 55%"
    - "minecraft:baked_potato 2-4 45%"
    - "minecraft:experience_bottle 2-6 50%"
    - "corazon_rojo 1 10%"
    - "corazon_amarillo 1 12%"
    - "corazon_morado 1 8%"
  # los cofres buenos (escondidos)
  dificil:
    - "oraxen:moneda 3:40,4:15,5:15,6:15,8:8"   # siempre 3 Trucoin o mas (en promedio unas 4 y media)
    - "oraxen:moneda_roja 1 11%"           # a veces ademas una Frackoin
    - "oraxen:moneda_morada 1 2%"          # Tinchoin: rarisima
    - "minecraft:echo_shard 1-3 80%"
    - "minecraft:enchanted_golden_apple 1 65%"
    - "minecraft:diamond 3:25,4:50,5:25 75%"   # cuando hay, unos 4
    - "minecraft:experience_bottle 4-10 70%"
    - "minecraft:netherite_ingot 1 70%"
    - "oraxen:mineral_truco 1 20%"         # Mineral de Tioduro
    - "oraxen:totem_golem 1 30%"
    - "oraxen:totem_cuy 1:1,2:1 60%"
    - "oraxen:totem_tod4 1 12%"            # TODtem
    - "corazon_rojo 1:1,2:1 80%"           # 80% de que salga, y la mitad de las veces 2
    - "corazon_amarillo 1-2 50%"
    - "corazon_morado 1 30%"

# mobs que aparecen cuando empieza a derrumbarse
#   mm:<nombre de MythicMobs>   creeper:<random|mini|calamar|void|nuclear|flash> (los de TOD4)   minecraft:<mob>
# "cantidad" repartidos por toda la cueva (tuneles y salas), y aparte los de cada zona.
mobs:
  cantidad: 60
  tipos:
    "creeper:random": 10
    "creeper:calamar": 10
    "mm:enderzombie": 5
    "zombie_tanque": 0          # zombi con mucha vida y armadura de hierro (para tanquear)
    "zombie_alucinado": 4       # al pegarte, por 30 s ves la vida, el hambre, el tab y el tiempo cambiados
    "minecraft:zombie": 15
    "minecraft:skeleton": 17
    "mm:BreezeOld": 15
    "mm:BombaVoladora": 20
    "minecraft:silverfish": 2
  # zonas: entrada, cruce, columnas (la de estalactitas), lago (el de lava), isla (el medio del lago), catedral, pozo, galeria
  zonas:
    columnas:        # la sala de las estalactitas: solo aca hay Flash Creepers (uno, y la mitad de las veces)
      cantidad: 2
      probabilidad: 50
      tipos:
        "creeper:flash": 1
    lago:            # solo aca hay blazes (te tiran y te podes caer a la lava)
      cantidad: 6
      tipos:
        "minecraft:blaze": 1

# el Creeper Nuclear: uno solo por corrida, en el medio de una de estas salas (al azar)
nuclear:
  probabilidad: 100
  lugares: [lago, columnas]

# el Papu (zombie_alucinado): si MythicMobs tiene alguno de estos mobs, sale ese; si no, un zombi comun con estos valores.
# disfraz: el disfraz guardado de LibsDisguises (/savedisguise papu ...). Los segundos de la alucinacion van en el config.yml de TOD4.
zombie_alucinado:
  mythicmobs: ["Papu", "ZombieAlucinado"]
  disfraz: "papu"
  vida: 40
  danio: 5
  velocidad: 0.28

# Phantom Truco (phantom_truco): no esta en la lista de arriba; se pone donde lo quieras (en tipos o en una zona).
# Si MythicMobs tiene este mob, sale ese (ahi va el modelo); si no, un enderman con estos valores.
phantom_truco:
  mythicmobs: "PhantomTruco"
  vida: 90
  danio: 7
  velocidad: 0.32

# el zombi para tanquear (zombie_tanque)
zombie_tanque:
  vida: 50
