plugins { id 'java' }
group = 'ar.tod5'
version = '0.22.0'
repositories {
	mavenCentral()
	maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
	compileOnly "io.papermc.paper:paper-api:${findProperty('paper_version') ?: '1.21.11-R0.1-SNAPSHOT'}"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
processResources { filesMatching('plugin.yml') { expand version: project.version } }
