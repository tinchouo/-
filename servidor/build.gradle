plugins { id 'java' }
group = 'ar.tod5'
version = '0.15.0'
repositories {
	mavenCentral()
	maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
	compileOnly "io.papermc.paper:paper-api:${findProperty('paper_version') ?: '26.3.build.8-alpha'}"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
processResources { filesMatching('plugin.yml') { expand version: project.version } }
