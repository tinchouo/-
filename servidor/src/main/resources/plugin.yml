name: TOD5
version: '${version}'
main: ar.tod5.servidor.TOD5Servidor
api-version: '1.21.11'
description: Plugin del server de TRUCOFDEATH Revenants (sala de espera, control del mod)
authors: [tinchooide, Trick]
commands:
  tod:
    description: Comandos de TOD
    usage: /tod <abrir|cerrar|estado|recargar|dia|crafteo|anuncio|novedad|editor|moneda|zona>
permissions:
  tod5.admin:
    description: Admins de TOD (entran aunque este cerrado y usan /tod)
    default: op
  tod5.editor:
    description: Editores de la tablet (ven lo oculto y editan). No alcanza con ser OP.
    default: false
