# ¿El server esta abierto para todos? Si no, esta "EN PREPARACION": solo entran los admins
# y los demas esperan en la fila desde el menu del mod (entran solos cuando abre).
# Se cambia con /tod abrir y /tod cerrar (no hace falta tocarlo aca).
abierto: false

# Admins: los OP entran siempre. Aca se pueden sumar mas por nombre.
admins: []

# Editores de la tablet: ven lo oculto (crafteos que no salieron, etc.) y editan.
# NO alcanza con ser OP: asi alguien puede tener OP (por ejemplo para WorldEdit) sin ver nada.
# Tambien: /tod editor agregar <nombre>  y  /tod editor sacar <nombre>
editores: []

# Hace falta el mod de TOD para entrar.
exigir_mod: true
# Segundos que espera el saludo del mod antes de echar al jugador.
espera_saludo: 6

# Mods permitidos (los ids de Fabric). Si alguien tiene otro, lo echa y le dice cual.
# Los de Minecraft/Fabric/Java siempre estan permitidos.
mods_permitidos:
  - tod5
  - fabric-api
  - sodium

mensajes:
  en_preparacion: "<green><bold>TRUCOFDEATH: Revenants</bold></green>\n<white>El server está en preparación.</white>\n<gray>Esperá en el menú: cuando abra vas a entrar solo.</gray>"
  sin_mod: "<red>Para entrar a <green>TRUCOFDEATH: Revenants</green> necesitás el mod.</red>"
  mods_prohibidos: "<red>Tenés mods que no están permitidos:</red>\n<yellow>{mods}</yellow>\n<gray>Sacalos y volvé a entrar.</gray>"
