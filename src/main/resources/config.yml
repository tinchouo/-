# ==========================================================
#  TOD4 - configuracion   (despues de cambiar: /tod4 recargar)
#  Los datos (mensajes, almas, muertos, cambios) se guardan aparte en datos.yml, avisos.yml, revivir.yml, cambios.yml
# ==========================================================

# no tocar: sirve para actualizar este archivo solo cuando cambia el plugin
config_version: 12

sidebar:
  activa: true
  titulo: "&f&r &#55ff55&lT&#4ef14e&lR&#47e447&lU&#40d640&lC&#39c939&lO&#33bb33&lF&#2cae2c&lD&#25a025&lE&#1e931e&lA&#178517&lT&#117811&lH &f&l4 &f&r"
  # logos del titulo durante el Momento Truco (rojo) y el gulag (azul): caracteres del resource pack
  logo_rojo: "\ue905"
  logo_azul: "\ue906"
  jugadores_max: 100
  # {jugador} {ping} {dia} {mundo} {jugadores} {equipo} {muertes} {muertes_hoy} | {separador} = la linea gris
  #  (si una linea tiene {equipo} y el jugador no tiene equipo, esa linea no se muestra)
  arriba:
    - "{separador}"
    - "&a■ &f&lPerfil"
    - " &8| &7Jugador: &f{jugador}"
    - " &8| &7Ping: &a{ping} ms"
    - " &8| &7Equipo: {equipo}"
    - "&a■ &f&lMundo"
    - " &8| &7Día: &f{dia}"
    - " &8| &7Jugadores: &f{jugadores}"
    - " &8| &7Dimensión: {mundo}"
  # la linea que separa (va abajo de lo de arriba y al final). Su ancho es el ancho de toda la sidebar:
  # los textos mas largos saltan de renglon solos.
  separador: "&8&m                                  "
  # abajo de la linea van las misiones / el Momento Truco / una frase de calma
  cambio_frase_segundos: 60
  frases_calma:
    - "&7Aprovecha la calma mientras dure..."
    - "&7No hay nada por aquí."
    - "&7No hay nada que ver por aquí."
    - "&7Todo tranquilo... por ahora."
    - "&7El silencio no dura para siempre."

mundos:
  overworld: "&aOverworld"
  nether: "&cNether"
  end: "&dEnd"
  # si el nombre del mundo (o de la dimension) contiene esta palabra:
  por_nombre:
    aether: "&bAether"
    backrooms: "&e???"

cambios:
  horno_chance: 0.01        # dia 1: chance por segundo de que explote cada horno prendido (haya o no alguien cerca)
  lava_dano: 1.5           # dia 3: dano de la lava con resistencia al fuego, cada medio segundo; fijo, la armadura no lo baja (3.0 = el doble)
  blaze_dano: 5.0          # dia 3: dano de la bola de fuego del blaze a quien tiene resistencia al fuego (5 = como siempre)
  agua_factor: 5            # dia 4: el aire baja X veces mas rapido (la Respiracion sigue ayudando)
  agua_golpe_ticks: 10      # dia 4: sin aire, cada cuantos ticks pega el ahogo (10 = cada 0,5 s; el juego usa 20)
  agua_dano_factor: 2.0     # dia 4: el dano de cada golpe de ahogo se multiplica por esto (lo demas, armadura/proteccion, lo hace el juego)
  perla_corazones: 4        # dia 4: dano de cada perla
  warden_intervalo_seg: 30  # dia 1: cada cuanto se prueba si aparece un Warden (con alguien adentro de una Ancient City)
  warden_maximo: 10         # dia 1: maximo de Wardens de este sistema a menos de warden_radio del jugador (los que salen por ruido no cuentan)
  warden_radio: 50          # dia 1: radio en bloques para contar ese maximo
  poder_ballesta_mesa: 0.4  # dia 2: chance de que la mesa vanilla (o un boton que no decide la mesa mejorada) ponga Poder a la ballesta
  poder_ballesta_mobs: 0.1  # dia 2: chance de que un pillager o piglin con ballesta nazca con Poder (nivel 1-4)
  creeper_muerte_chance: 0.10   # dia 7: chance de que al morir aparezca un creeper electrico
  zombies_partes_min: 2         # dia 9: partes de armadura de cada zombie (entre min y max)
  zombies_partes_max: 4
  zombies_diamante: 0.5         # dia 9: chance de que cada parte sea de diamante (si no, hierro)
  zombies_prote4: 0.5           # dia 9: chance de que toda su armadura tenga Proteccion IV
  zombies_espada: 1.0           # dia 9: chance de llevar espada (mitad hierro, mitad diamante)
  zombies_espada_encantada: 0.5 # dia 9: chance de que la espada tenga Filo
  zombies_filo_max: 5           # dia 9: Filo entre 1 y este nivel (todos igual de probables)
  zombies_drop: 0.0             # dia 9: chance de que suelten cada pieza al morir (0 = nunca)
  creeper_muerte_vida: 1.0      # dia 7: vida del creeper electrico que sale al morir (1 = medio corazon)
  pacificos_vision: 16          # dia 8: los animales a esta distancia que te ven te persiguen
  pacificos_velocidad: 1.3
  pacificos_dano: 1.0           # dia 8: dano fijo de cada golpe (1 = medio corazon, la armadura no lo baja), uno por segundo
  pacificos_tnt_distancia: 3    # dia 8: a esta distancia te ponen una TNT
  pacificos_tnt_cada_seg: 10    # dia 8: cada animal pone una TNT como mucho cada tanto
  pacificos_tnt_mecha: 40       # dia 8: la TNT explota a los 40 ticks (2 s), como siempre 80
  ballestero_chance: 0.15       # dia 10: chance de que un esqueleto salga como Ballestero
  ballesteros:                  # dia 10: los tres esqueletos ballesteros
    proteccion: 6               # Proteccion de las 4 piezas de cuero (las de los tres)
    rojo:                       # ballesta con Poder V; de cerca te corre y te pega con la ballesta
      peso: 60                  # cual sale mas seguido (60/25/15)
      vida: 40                  # 40 = 20 corazones
      cada_seg: 1.5
      velocidad: 3.15
      dano_base: 5.0            # flecha comun 2 + Poder V (3). El juego lo multiplica por la velocidad
      cuerpo_a_cuerpo: 5        # a esta distancia deja de disparar y te pega
      filo: 20                  # Filo de su ballesta (para el golpe)
    amarillo:                   # cohetes de fuegos artificiales: explotan al tocar algo (dano en area)
      peso: 25
      vida: 60                  # 30 corazones
      cada_seg: 2.5
      velocidad: 1.6
      estrellas: 3              # mas estrellas = mas dano (cada una suma)
    negro:                      # arco: cada flecha sale como una TNT prendida
      peso: 15
      vida: 80                  # 40 corazones
      fuerza: 0.9               # la TNT sale con esta parte de la velocidad de la flecha
      mecha_extra_ticks: 10     # la TNT explota esto despues de llegar
    # (los de ballesta se mantienen a "distancia: 11" de su objetivo y se corren de costado)
  nuclear_muerte_chance: 0.01   # dia 11: chance de que al morir aparezca un Creeper Nuclear (aparte del electrico)
  plantas_factor: 3             # dia 7: las plantas crecen esta cantidad de veces mas lento
  xp_multiplicador: 2           # dia 7: experiencia de los hostiles que mata un jugador (y de MythicMobs) y de los minerales del Overworld
  wither:                       # dia 8: el Wither x2
    vida: 2
    dano: 2
    velocidad: 1.5
    efecto_duracion: 2          # el efecto Wither dura el doble...
    efecto_niveles: 1           # ...y tiene un nivel mas
    disparo_extra: 1.0          # chance de que tire otro craneo despues de cada uno (1 = siempre: dispara el doble)
    explosion_craneo: 2
    explosion_inicio: 2
  equipo_caido_porcentaje: 5    # dia 8: % de dano de mas por cada companero de equipo muerto (sin tope)
  esqueletos:                   # dia 9: esqueletos armados (la armadura usa las chances de zombies_*)
    poder_min: 1
    poder_max: 3
    dano_nivel: 2               # flecha de dano instantaneo II
    levitacion_nivel: 5
    levitacion_seg: 3
    ceguera_seg: 5
    lentitud_nivel: 3
    lentitud_seg: 5
  minero:                       # dia 10: Zombie Minero
    vida: 50
    dano: 6                     # 3 corazones por golpe
    techo_y: 40                 # nunca sale arriba de esta altura
    referencia_y: -50           # a esta altura sale uno cada...
    minutos_en_referencia: 5    # ...tantos minutos por jugador (mas abajo, mas seguido)
    max_por_jugador: 2
    vision: 40                  # te ve a traves de los bloques a esta distancia
    tnt_distancia: 4
    tnt_cada_seg: 8
    tnt_mecha: 50
    tnt_fuerza: 2               # la TNT normal x2 (fuerza y radio)
    cava_cada_seg: 0.75
    oro_chance: 0.25            # cada parte de armadura de oro, con Proteccion 1 a 4
  herramientas:                 # dia 8: romper algo de pico o hacha sin estas (ids de Oraxen) saca medio corazon
    permitidas: [todpico, todaxe]
    dano: 1.0
  backrooms:                    # dia 13: al acostarse, chance (%) de despertar en las backrooms (/tod4 backrooms = donde caen)
    chance: 5
    espera_seg: 2.5
  hambre_multiplicador: 2       # dia 11
  noches_dano: 2                # dia 12: de noche, en el Overworld, los hostiles pegan esto
  totem_ceguera_seg: 2          # dia 14
  infinidad_ballesta_mesa: 0.15 # dia 2: chance de que la mesa vanilla ponga Infinidad a la ballesta (no va con Reparacion)
  silverfish_chance: 0.033  # dia 2: chance por bloque picado debajo de Y 0 (0.033 = 1 de cada 30)
  silverfish_y_max: 0
  silverfish_fatiga_seg: 5      # dia 2: cada mordida suma estos segundos de fatiga minera
  silverfish_fatiga_max_seg: 30 # dia 2: tope de la fatiga
  bedrock_wither_nivel: 3       # dia 6: Wither III = 1 corazon por segundo
  bedrock_armadura_segundos: 60 # dia 6: en cuanto se rompe la armadura tocando bedrock (sin Irrompibilidad)

# Para pasar la noche: un cuarto de los jugadores, minimo 5 (si hay menos, todos). Cuentan Overworld y Aether.
sueno:
  activo: true
  porcentaje: 25
  minimo: 5

# Cambio del dia 6 (d6.noches): la noche del Overworld dura "factor" veces mas.
# Hora del juego: 12542 = ya se puede dormir, 23460 = amanece. Esa es "la noche" (tambien para el dia 12, noches peligrosas)
noches:
  factor: 3
  desde: 12542
  hasta: 23460

avisos:
  sonido_custom_1: "tod4:custom_1"
  sonido_custom_2: "tod4:custom_2"
  sonido_custom_3: "tod4:custom_3"
  sonido_custom_4: "tod4:custom_4"
  sonido_custom_5: "tod4:custom_5"
  # cuando la ruleta cae siempre suena el de experiencia. Si cae en ROJO (Momento Truco), 2 segundos despues:
  momento_truco_comandos:
    - "animation false 1 148 295"
    - "execute as @a at @s run playsound tod4:momento_truco master @s ~ ~ ~ 1 1"
  momento_truco_espera_ticks: 140

tab:
  activo: true    # [mision] [alma] [EQUIPO] [L] nombre (reemplaza al tabulador.sk); arriba de la cabeza lo mismo
  vida: true      # corazones de vida en el tab

equipos:
  simbolo_lider: "[L]"

chat:
  # cuando un jugador escribe: "Nombre: mensaje" (el nombre y los dos puntos en este color, el mensaje en blanco)
  formato: true
  color_nombre: "&a"

momentos:
  delay_castigo_seg: 15   # el castigo llega X segundos despues de que termina (para leer el chat)
  vineta: true            # pantalla con vineta roja durante el Momento Truco (desde que sale la animacion)
  vineta_intensidad: 0.75 # de 0.05 (casi nada) a 0.99 (muy roja)
  # tag de los jugadores que no participan (como las nutrias de Desafio): /tag <jugador> add exento_momento
  tag_exento: exento_momento
  # simbolo del tiempo en la sidebar
  simbolo_tiempo: "⌚"
  # sonido para todos cuando termina el Momento Truco (no sale nada en el chat)
  sonido_fin: "entity.wither.spawn"
  sonido_fin_tono: 0.6

# Cosmic Clones: /tod4:clones pos1, pos2, crear <nombre>, modo <zona> <fila|gigante>
clones:
  disfraz: "cosmic_clone"     # disfraz guardado de LibsDisguises (/savedisguise cosmic_clone ...)
  dano: 6.0                   # 3 corazones fijos por golpe (no lo baja nada; si te mataria, el totem te salva)
  inmune_seg: 1.0             # despues de un golpe, este tiempo sin que otro clon te pegue
  empujon: 0.7
  cantidad: 10                # modo fila
  retraso_seg: 2.0            # el primero de la fila (y el gigante)
  distancia_seg: 2.0          # distancia entre un clon y el siguiente
  radio: 0.8                  # distancia a la que pega (el gigante: esto x su tamanio)
  velocidad_recuperar: 2.0    # cuando uno se va al final, los demas van x2 hasta volver a quedar a su distancia
  gigante_escala: 2.0         # el gigante mide esto x el tamanio del jugador (el clon normal mide lo mismo que el jugador)
  gigante_cantidad: 1         # cuantos gigantes (fila de gigantes)
  gigante_distancia_seg: 3.0
  transicion_seg: 3.0         # al pegar: el clon queda como particulas que viajan al final de la fila
  brillo: false               # contorno brillante (blanco)
  # skin: si skin_valor tiene algo, se usa esa (valor y firma de MineSkin); si se deja vacio, se usa el disfraz guardado
  # (si estas lineas no estan, se usa la skin del Cosmic Clone que viene con el plugin)
  nombre: "Cosmic"
  ambiente_cada_ticks: 40     # cada cuanto suena el susurro de humo de cada clon
  # sonidos ("" = ninguno). Se puede cambiar el tono y el volumen con <clave>_tono y <clave>_volumen
  sonidos:
    aparece: "entity.illusioner.prepare_mirror"
    aparece2: "block.amethyst_block.resonate"
    vuelve: "entity.illusioner.mirror_move"
    vuelve2: "entity.breeze.shoot"
    explota: "entity.wind_charge.wind_burst"
    explota2: "block.beacon.deactivate"
    ambiente: "particle.soul_escape"

misiones:
  sonido_activar_dia: "block.end_portal.spawn"
  sonido_activar_op: "block.note_block.chime"
  sonido_meta: "tod4:meta_mision"     # cada objetivo completado (menos el ultimo)
  sonido_gg: "tod4:gg_mision"         # cuando completas todos
  sonido_completar_dia: "tod4:completar_diaria"
  sonido_completar_op: "tod4:completar_opcional"
  # como se ve el estado en la sidebar (en curso lleva los puntitos animados al final)
  estados:
    en_curso: "&7En curso"
    completada: "&6¡Completada!"
    reclamada: "&eReclamada ✔"
    bloqueada: "&cBloqueada 🔒"

palo:
  mundo_principal: "world"

revivir:
  # al revivir: segundos de Resistencia V (no le entra dano mientras carga el pack y hace el login)
  resistencia_seg: 90
  nombre_totem: "Tótem Cuy"
  mensaje_totem: "&6✟ &6&l{jugador} &7ha usado un &6&l{totem}&7."
  sonido_ritual: "tod4:revivir"
  # los items de revivir solo sirven el dia en que aparecen (al dia siguiente dicen en rojo que quedaron inutilizables)
  items_vencen: true
  sonido_revivido: "tod4:revivido"
  sonido_muerte: "minecraft:dedsafio"
  comandos_muerte:
    - "animation false 1 0 147"
  nombres_mobs:
    zombie: "Zombi"
    zombified_piglin: "Zombi Piglin"
    skeleton: "Esqueleto"
    creeper: "Creeper"
    spider: "Araña"
    cave_spider: "Araña de Cueva"
    enderman: "Enderman"
    witch: "Bruja"
    iron_golem: "Golem de Hierro"
    blaze: "Blaze"
    ghast: "Ghast"
    magma_cube: "Cubo de Magma"
    wither_skeleton: "Esqueleto Wither"
    phantom: "Fantasma"
    drowned: "Ahogado"
    husk: "Zombi Momificado"
    stray: "Esqueleto Glacial"
    guardian: "Guardián"
    pillager: "Saqueador"
    vindicator: "Vindicador"
    evoker: "Invocador"
    ravager: "Devastador"
    warden: "Warden"

# Videos a pantalla completa (/tod4:video <jugador> <video>). Los cuadros son un item del pack con un modelo por cuadro.
videos:
  lobotomia:
    modelo: "tod4:video_lobotomia"
    cuadros: 109
    ticks_por_cuadro: 2
    sonido: "lobotomia:video"

  # El screamer: /tod4:video <jugador> screamer. No traba la camara (la imagen aparece encima y se desvanece).
  # Los mobs con la etiqueta tod4_screamer lo tiran al pegar. Si esta parte no esta, igual anda con estos valores.
  screamer:
    modelo: "tod4:screamer"
    cuadros: 27
    ticks_por_cuadro: 1
    sonido: "tod4_screamer:screamer"
    volumen: 1.0
screamer_espera_seg: 0      # 0 = en cada golpe; si no, segundos de espera para el mismo jugador

# Phantom Truco (mobs con la etiqueta tod4_phantom, PhantomTruco.yml de MythicMobs): te pega, te empuja,
# se teletransporta lejos y a los segundos aparece a unos 10 bloques y viene corriendo. Si nada de esto esta, usa estos valores.
phantom:
  sin_pegar_seg: 3        # despues de pegar, cuanto tarda en poder pegar otra vez
  empuje: 1.4             # que tan fuerte te empuja
  empuje_arriba: 0.45
  lejos_min: 18           # adonde se va despues de pegar (bloques)
  lejos_max: 26
  vuelve_seg: 3           # cuantos segundos se queda quieto (lejos) antes de volver
  vuelve_distancia: 10    # a cuantos bloques tuyo aparece cuando vuelve
  busca_radio: 30         # de que tan lejos te ve
  debug: false            # true = escribe en la consola lo que hace

# Murcielagos Vampiro: reemplazan a los murcielagos comunes del overworld (cuevas oscuras) y, de noche, aparecen cerca de
# los jugadores. Nunca arriba de agua/lava, sin piso abajo o con luz de antorchas. Al sol se queman. Vuelan recto hacia vos y, pegados,
# te roban un corazon de la vida maxima cada medio segundo (primero los rojos; los amarillos no protegen; sin corazones, moris).
# Lo robado vuelve al morir o con el Corazon Morado. Para probar: /tod4 murcielago [cantidad]
murcielagos:
  activo: true
  desde_dia: 11
  reemplazar_comunes: true  # los murcielagos comunes del overworld no aparecen mas (en su lugar, uno vampiro)
  luz_maxima: 7           # no aparecen donde la luz de antorchas/lamparas es mayor a esto
  dano_sol: 3             # dano por segundo al sol (vida 10: dura ~3 s)
  de_noche_cerca: false   # true = ademas, de noche, aparecen cerca de los jugadores (con lo de abajo)
  cada_seg: 20            # de noche: cada cuanto se tira la moneda para cada jugador
  probabilidad: 0.25      # chance de que aparezca uno en cada tirada
  max_por_jugador: 2
  distancia_min: 16       # a cuantos bloques aparece
  distancia_max: 28
  velocidad: 0.3          # bloques por tick (0.3 = 6 por segundo; correr es 5,6)
  muerde_cada_ticks: 10   # 10 = medio segundo
  alcance: 1.4
  vida: 10
  dura_seg: 90            # despues se va

# Alucinacion (Zombi Alucinado del Agujero, mobs con la etiqueta tod4_alucina, /tod4:alucinar):
# el que la tiene ve la vida, el hambre y el tab cambiando al azar (es solo lo que ve).
alucinacion:
  segundos: 30
  cambia_cada_ticks: 20


# Mobs de MythicMobs + Better Model
mobs:
  mundo_backrooms: backrooms
  howler_etiqueta: howler     # la etiqueta que le pone su archivo de MythicMobs (addtag)
  howler_velocidad: 1.0       # multiplica su velocidad de movimiento mientras persigue

# Anuncios en Discord (con el bot de DiscordSRV). Si tu config.yml no tiene esta parte, se usan estos mismos valores.
discord:
  activado: true
  everyone: true                 # @everyone abajo de cambios, avisos, dungeons y misiones
  muertes: true                  # cada muerte al canal de muertes, igual que en el chat (no los OP ni los cuyes)
  muertes_everyone: true         # @everyone abajo de cada muerte
  # morir en el gulag es para siempre: este mensaje en vez del normal ({jugador}, {dia}; \n = otro renglon)
  gulag_mensaje: "## ⛓ {jugador} ha caído en el Gulag.\nHa caído de manera definitiva y no podrá ser revivido."
  # canal de revividos: "✨ Trick revivió a @Agus" (solo etiqueta al revivido; {quien}, {revivido}, {dia})
  revividos: true
  revivido_mensaje: "### ✨ {quien} revivió a {revivido}"
  pie: "-# TrucOfDeath 4"
  canales:
    cambios: "1553108084304388216"    # mensajes naranjas (cambio de dificultad, nuevo mob...)
    avisos: "1563954729883668621"     # mensajes celestes
    dungeons: "1563924288665427989"   # mensajes azules (nueva dungeon)
    misiones: "1553108308863225937"   # misiones diarias y opcionales nuevas
    muertes: "1554183344529342504"
    revividos: ""                     # /tod4 discord canal revividos <id>

# Subasta (/tod4 subasta, /pujar). Todo se cuenta en amarillas. Si tu config.yml no tiene esta parte, se usan estos valores.
subasta:
  monedas:            # id de Oraxen -> cuanto vale en amarillas
    moneda: 1
    moneda_roja: 10
    moneda_morada: 100
  iconos:             # caracter de cada moneda en la fuente tod4:monedas del pack (TOD4_extras.zip)
    moneda: ""
    moneda_roja: ""
    moneda_morada: ""
