name: TOD4
version: 2.0.0
main: ar.tod4.TOD4
api-version: '1.21'
author: TrucOfDeath
description: TrucOfDeath 4 - misiones, momentos truco, cambios, avisos, revivir, sidebar.
softdepend: [PlaceholderAPI, Skript, Oraxen, MythicMobs]
permissions:
  tod4.admin:
    default: op
commands:
  tod4:
    description: Ayuda y comandos generales de TOD4
  misiones:
    description: Tus misiones (diaria y opcional)
    aliases: [quest, quests]
  panel:
    description: Panel de misiones (admin)
  completar:
    description: Marcar una mision como completada
  momentostruco:
    description: Momentos Truco
  cambios:
    description: Menu de cambios de dificultad
  avisos:
    description: Mensajes, bienvenidas y ruleta
  altar:
    description: Configuracion del altar de revivir
  alma:
    description: Dar o quitar un alma
  revivir:
    description: Revivir a un jugador
  palo:
    description: Palo de Retorno
  video:
    description: Reproduce un video a pantalla completa a un jugador
  aether_pocion:
    description: Da la Pocion del Aether
  aether_init:
    description: Inicia el mapa del Aether
  aether_reset:
    description: Borra o reinicia el Aether
  aether_tp:
    description: Te lleva al spawn del Aether
  aether_locate:
    description: Lista las estructuras del Aether
  aether_goto:
    description: Te lleva a una estructura del Aether
  aether_fill:
    description: Genera partes del Aether sin caminar
  aether_test:
    description: Revisa los puentes del Aether
  aether_force:
    description: La proxima estructura del Aether sera la elegida
  aether_music:
    description: Prueba la musica del Aether
  equipo:
    description: Equipos (admins)
  eq:
    description: Chat y opciones de tu equipo
