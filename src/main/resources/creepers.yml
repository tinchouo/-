# =====================================================================
#  CREEPERS DEL DIA 5   (se prenden en /tod4:cambios -> Dia 5 -> Mobs)
#  Despues de cambiar algo: /tod4 recargar
#  Para probar uno: /tod4:creeper <random|mini|calamar|void|nuclear|flash>
# =====================================================================

# Cada vez que aparece un creeper normal, con esta chance (%) aparece ADEMAS uno de estos cerca
# (a lo sumo uno por creeper; el Mini viene en grupo). Aparecen con las reglas de un creeper (suelo firme, oscuro)
# y solo en el Overworld; el Void Creeper tambien en el Nether y el End (con los bichos hostiles de ahi).
chances:
  nuclear: 3
  void: 8
  calamar: 12
  flash: 14
  mini: 14
  random: 16

# Cada vez que aparece un zombie, esqueleto, araña u otro bicho hostil, con esta chance (%) se tira el mismo sorteo de arriba
chance_con_otros: 4

# Nombre interno de cada uno en MythicMobs
mythic:
  random: RandomCreeper
  mini: MiniCreeper
  calamar: CreeperCalamar
  void: VoidCreeper
  nuclear: CreeperNuclear
  # si no existe en MythicMobs, sale un creeper comun con lo del Flash
  flash: FlashCreeper

mini:
  grupo_min: 3
  grupo_max: 5
  # te ve a esta distancia, prende la mecha y te persigue
  vision: 10
  mecha_seg: 5
  tamano: 0.5

nuclear:
  tamano: 1.5
  # cuando llega a esta distancia se planta y arranca la cuenta (si lo matan antes, no explota)
  rango_activar: 3.5
  cuenta_seg: 10
  # a cuantos bloques se ve la barra de aviso
  radio_aviso: 80
  vida: 50
  # al plantarse tiene Resistencia de este nivel hasta que explota (hay que matarlo con arco)
  resistencia: 3
  # volumen de los sonidos de la cuenta (5 = se oyen hasta ~80 bloques)
  volumen_cuenta: 5
  # mata hasta este radio (es tambien hasta donde llega el fuego), aunque lleves prot 4 completa; solo te salva un totem
  radio_mortal: 22
  # el dano baja con la distancia: en el centro y en el borde del radio mortal (el desgaste de armadura es ~ dano / 4)
  dano_centro: 800
  dano_borde_mortal: 400
  # mas alla del radio mortal el dano es bajo y sigue bajando hasta este radio
  radio_dano: 40
  # radio del crater (bloques que rompe)
  radio_bloques: 15
  veneno_seg: 10

void:
  # cuanto tarda en explotar (en ticks; 15 = 0,75 s, un creeper comun 30)
  mecha_ticks: 15
  # velocidad respecto de un creeper comun (1.2 = 20% mas rapido)
  velocidad: 1.2

calamar:
  # cuanto dura la tinta en la pantalla (se va desvaneciendo)
  tinta_seg: 3

flash:
  # cuanto pega su explosion respecto de un creeper comun (0.5 = la mitad, 1 = igual)
  dano: 0.5
  # cuanto tarda en explotar cuando te alcanza (en ticks; 2 = al instante, un creeper comun 30)
  mecha_ticks: 2
  # velocidad respecto de un creeper comun (2 = el doble)
  velocidad: 2.0
  # encandila a los que estan a esta distancia y lo ven cuando explota
  radio: 8
  # la pantalla blanca dura esto (se va apagando)
  ceguera_seg: 4
  # mientras tanto casi no se escucha el juego, solo el zumbido
  sordera_seg: 3
  zumbido: "tod4flash:zumbido"
