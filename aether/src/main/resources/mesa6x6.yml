# =====================================================================
#  MESA DE CRAFTEO 6x6        despues de cambiar algo: /tod4:aether_recargar
#  La mesa se craftea: 4 mesas de crafteo en las esquinas, 4 lingotes de hierro y un bloque de hierro en el centro.
#  Tambien: /tod4:aether_mesa dar [jugador]. Clic derecho abre la grilla.
# =====================================================================

mesa:
  nombre: "&dMesa de crafteo 6x6"
  titulo: "&8Mesa de crafteo 6x6"
  lore:
    - "&7Una mesa más grande, para crafteos especiales."
  # el bloque de Oraxen con la textura (Oraxen/items/mesa_6x6.yml). Si no esta, es una mesa de crafteo marcada.
  oraxen_id: mesa_6x6
  # false = no se puede craftear (solo con /tod4:aether_mesa dar)
  crafteo: true
  # (solo para la mesa marcada sin Oraxen) modelo del pack para el item
  modelo: ""

# Cada receta: la forma (6 renglones de 6; "." = vacio) y que item es cada letra.
#   item: minecraft:id (normal, no de Oraxen) u oraxen:id
#   resultado: oraxen:id o minecraft:id  (o el de tu mano: /tod4:aether_mesa resultado <receta>)
recetas:
  espada_amatista:
    forma:
      - "....BB"
      - "...BBB"
      - "B.BBB."
      - ".LBB.."
      - ".VL..."
      - "B..B.."
    ingredientes:
      B: minecraft:amethyst_block
      L: minecraft:resin_bricks
      V: minecraft:breeze_rod
    resultado: oraxen:rosarioxsespada
    cantidad: 1
  # La espada (de Oraxen menos la obsidiana llorosa). Despues: hoja arriba y mango abajo en la mesa normal.
  hoja_espada:
    forma:
      - "..FF.."
      - "..SS.."
      - "S.SS.S"
      - ".OSSO."
      - "..SS.."
      - "..OO.."
    ingredientes:
      F: oraxen:filo_abisal        # lo suelta un mob
      S: oraxen:bloque_tioduro     # el bloque de Tioduro (si en Oraxen tiene otro id, cambialo aca)
      O: minecraft:crying_obsidian
    resultado: oraxen:hoja_espada
    cantidad: 1
  mango_espada:
    forma:
      - "BBRRBB"
      - "..BB.."
      - "..BB.."
    ingredientes:
      B: oraxen:breeze_reforzado   # Obsidiana Llorosa Aireada (8 bloques = 64 varas de breeze)
      R: oraxen:mineral_truco      # Mineral de Tioduro
    resultado: oraxen:mango_espada
    cantidad: 1
