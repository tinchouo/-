# =====================================================================
#  MOBS DEL AETHER (MythicMobs)          despues de cambiar algo: /tod4:aether_recargar
#
#  Aparecen como mobs normales: cada lugar tiene los suyos, salen cuando alguien se acerca
#  (nunca al lado: a mas de distancia_min de todos) y si los matan vuelven a los reaparece_seg.
#  Si te vas y volves, estan. Las islas de hongo no tienen nada.
#  Prender / apagar en el juego: /tod4:aether_mobs on|off   |  Probar todos los mobs: /tod4:aether_mobs probar
# =====================================================================

activado: true
# cada cuantos segundos se revisan los lugares (el ambiente, cada 2)
cada_seg: 6
# nunca aparecen a menos de esto de un jugador...
distancia_min: 20
# un mob del Aether sin ningun jugador a esta distancia se borra (y vuelve a aparecer cuando alguien se acerca)
borrar_lejos: 160
# un lugar se llena cuando hay un jugador a menos de esto de su borde
distancia_activa: 100
# cuando matan a los de un lugar, tardan esto en volver
reaparece_seg: 180
# tope de mobs del Aether en todo el mundo
maximo_total: 300

# nombre interno en MythicMobs de cada uno
mobs:
  guardia: GUARDIA_ANGELICAL
  serafin: AngelSerafin
  fantasma: AllayLadron
  phantom: SecuestradorAereo
  breeze: BreezeOld
  thor: Thor
  sumo: SUMO_ANGELICAL
  bomba: BombaVoladora
  yeti: YetiDorado

# estos aparecen unos bloques en el aire (no caminan)
voladores: [fantasma, bomba, phantom]

# ---------------------------------------------------------------------
#  AMBIENTE: como los mobs normales. Alrededor de cada jugador, en el piso de cualquier isla,
#  segun el bioma. En las estructuras (aldea, molino, coliseo) salen menos: ahi estan sus propios mobs.
# ---------------------------------------------------------------------
ambiente:
  # cuantos de estos puede haber alrededor de cada jugador (a menos de radio_conteo)
  max_por_jugador: 10
  radio_conteo: 64
  # intentos por jugador cada 2 segundos
  intentos: 2
  # aparecen entre distancia_min y esto de un jugador
  distancia_max: 56
  biomas:
    # chance: % de que salga algo en cada intento.  mobs: peso de cada uno (mas peso = sale mas seguido)
    land:            {chance: 100, mobs: {guardia: 70, fantasma: 15, breeze: 10}}
    village:         {chance: 35,  mobs: {guardia: 70, fantasma: 15, breeze: 10}}
    windmill:        {chance: 35,  mobs: {guardia: 70, fantasma: 15, breeze: 10}}
    coliseum:        {chance: 35,  mobs: {guardia: 70, fantasma: 15, breeze: 10}}
    mushroom_island: {chance: 0,   mobs: {}}

# ---------------------------------------------------------------------
#  LUGARES: los mobs propios de cada estructura (aparecen repartidos por todo el lugar cuando alguien se acerca)
#  Cuantos:  "2-3"  |  "1"  |  "1 50%"  (la mitad de esos lugares tiene uno). El sorteo es una vez por lugar.
# ---------------------------------------------------------------------
lugares:
  # islas grandes con ruinas
  ruina_grande: {serafin: "1 60%"}
  # aldea: un serafin y una bombita por cada puente (una aldea tiene unos 15 a 18 puentes), repartidos por toda la aldea
  aldea:        {serafin: "17-21", bomba: "18-23"}
  # isla del medio del molino (afuera del molino, ahi tambien el Sumo) y las islitas de alrededor que tienen ruinas
  molino:       {serafin: "4-5", thor: "1", sumo: "1"}
  molino_ruina: {serafin: "1-2"}
  # el Yeti Dorado, en el medio de la arena
  coliseo:      {yeti: "1"}

# estos lugares tienen su mob en el medio (la arena del coliseo), aunque haya jugadores cerca
en_el_centro: [coliseo]

# true = el cambio de lugar del Breeze Old lo hace el plugin. false = lo hace breeze_old.sk (NUNCA los dos: se anulan)
breeze_cambiazo_plugin: false

# Phantom Angelical: en el cielo, en todo el Aether menos las islas de hongo
phantoms:
  max_por_jugador: 3
  # chance (%) en cada revision de que aparezca uno cerca de cada jugador (si tiene menos del maximo)
  chance: 40
  # true = tambien sobre las islas de hongo
  en_hongo: false
# (los mobs del Aether no se queman con el sol: el plugin lo evita)
