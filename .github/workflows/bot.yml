name: Probar con jugador
on:
  push:
    paths: ['src/**', '.github/workflows/bot.yml', '.github/pruebas/bot.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Compilar y preparar
        run: |
          mvn -B -q package
          mkdir -p srv/plugins && cd srv
          J=$(curl -s -H "User-Agent: tod4-ci" https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds)
          URL=$(echo "$J" | jq -r 'max_by(.id) | .downloads."server:default".url')
          curl -sL -o paper.jar "$URL"
          cp ../target/TOD4.jar plugins/
          # como en el server de verdad: un config.yml que no tiene la parte del screamer
          mkdir -p plugins/TOD4 && printf 'config_version: 12\nphantom:\n  debug: true\n' > plugins/TOD4/config.yml
          echo "eula=true" > eula.txt
          printf "online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\n" > server.properties
          cd .. && mkdir bot && cd bot && npm init -y > /dev/null && npm i minecraft-protocol@latest > /dev/null && cp ../.github/pruebas/bot.js .
      - name: Probar el screamer con un jugador
        run: |
          cd srv
          (sleep 90; echo "op tester"; sleep 3; echo "tod4:video tester screamer"; sleep 1; echo "tp tester ~ ~ ~ 90 30"; sleep 4; echo "playsound tod4_screamer:screamer master tester"; sleep 4; echo "tod4:alucinar tester 3"; sleep 4; echo "gamemode survival tester"; echo "summon enderman 0 -60 3 {Tags:[\"tod4_screamer\"],PersistenceRequired:1b}"; sleep 25; echo stop) | timeout 240 java -Xmx2G -jar paper.jar --nogui > log.txt 2>&1 &
          sleep 70
          (cd ../bot && timeout 90 node bot.js > ../srv/bot.txt 2>&1) || true
          wait || true
          cat bot.txt | head -150
          grep -iE "tester|screamer|Exception|error" log.txt | head -40
          grep -E "\[Phantom\]" log.txt | head -10
          grep -q "\[Phantom\] le pego a tester" log.txt || { echo "::error::El Phantom no pego"; exit 1; }
          N=$(grep -c '"type":69' bot.txt); echo "imagenes de screamer: $N"; [ "$N" -ge 3 ] || { echo "::error::El screamer no salio en cada golpe"; exit 1; }
          grep -E "player_chat|profileless_chat|GENIO" bot.txt | cut -c1-900 | head -5
          grep -E "(player_chat|profileless_chat|system_chat).*tod4:emojis" bot.txt > /dev/null || echo "::warning::No vi la imagen de :GENIO: en el chat"
          grep -q "27 cuadros, modelo tod4:screamer, sonido tod4_screamer:screamer" log.txt || { echo "::error::El screamer no salio con los valores del pack"; exit 1; }
      - name: Guardar el log en la rama ci-logs
        if: always()
        run: |
          mkdir /tmp/l && cp srv/log.txt /tmp/l/bot_server.txt; cp srv/bot.txt /tmp/l/bot.txt || true
          cd /tmp/l && git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "bot $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs:ci-logs-bot
