name: Probar scripts
on:
  push:
    paths: ['skripts/**', '.github/workflows/skript.yml']
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Bajar Paper 1.21.4 y Skript
        run: |
          set -e
          mkdir srv && cd srv
          B=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds | jq -r '.builds | map(select(.channel=="default")) | last | .build')
          curl -sL -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/$B/downloads/paper-1.21.4-$B.jar"
          mkdir -p plugins/Skript/scripts
          U=$(curl -s https://api.github.com/repos/SkriptLang/Skript/releases | jq -r '[.[] | select(.prerelease==false)][0].assets[] | select(.name|endswith(".jar")) | .browser_download_url' | head -1)
          echo "Skript: $U"
          curl -sL -o plugins/Skript.jar "$U"
          cp ../skripts/*.sk plugins/Skript/scripts/
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > server.properties
      - name: Arrancar y cargar los scripts
        run: |
          cd srv
          (sleep 150; echo stop) | timeout 300 java -Xmx2G -jar paper.jar --nogui > log.txt 2>&1 || true
          grep -iE "skript|error|warn|line [0-9]+|\.sk" log.txt | grep -v "^\s*$" | head -150
          echo "----"
          if grep -qE "Encountered [1-9][0-9]* errors? while reading|\[Skript\].*(error|Error)" log.txt; then
            grep -nE "Line [0-9]+|line [0-9]+|error" log.txt | head -80 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          fi
