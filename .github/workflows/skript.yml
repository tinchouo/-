name: Probar scripts
on:
  push:
    paths: ['skripts/**', '.github/workflows/skript.yml']
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skript: ['2.14.1', '2.15.1', '2.16.1']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Bajar Paper 1.21.4 y Skript
        run: |
          mkdir srv && cd srv
          J=$(curl -s -H "User-Agent: tod4-ci" https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds)
          URL=$(echo "$J" | jq -r 'max_by(.id) | .downloads."server:default".url' 2>/dev/null)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then echo "::error::No pude obtener Paper: ${J:0:300}"; exit 1; fi
          curl -sL -o paper.jar "$URL"
          mkdir -p plugins/Skript/scripts
          R=$(curl -s https://api.github.com/repos/SkriptLang/Skript/releases/tags/${{ matrix.skript }})
          U=$(echo "$R" | jq -r '.assets[] | select(.name|endswith(".jar")) | .browser_download_url' | head -1)
          if [ -z "$U" ]; then echo "::error::No pude obtener Skript"; exit 1; fi
          echo "::notice::Paper $URL | Skript $U"
          curl -sL -o plugins/Skript.jar "$U"
          cp ../skripts/*.sk plugins/Skript/scripts/
          # prueba de la explosion del Creeper Nuclear con ruedas (creeper_nuclear.sk)
          printf '%s\n' 'command /probarnuclear:' '\ttrigger:' \
            '\t\tset {_l} to location(0, -60, 0, world "world")' \
            '\t\tspawn a pig at {_l}' \
            '\t\tset {_p} to last spawned entity' \
            '\t\tset name of {_p} to "Creeper Nuclear"' \
            '\t\tset {_id} to "%uuid of {_p}%"' \
            '\t\tset {_bar} to "tod4:cnr_%{_id}%"' \
            '\t\texecute console command "bossbar add %{_bar}% """""' \
            '\t\texecute console command "bossbar set %{_bar}% name {""text"":""☢ CREEPER NUCLEAR ☢  5s"",""color"":""yellow"",""bold"":true}"' \
            '\t\texecute console command "execute at %{_id}% run bossbar set %{_bar}% players @a[distance=..80]"' \
            '\t\texecute console command "execute at %{_id}% run playsound tod4:creeper.nuclear.count1 hostile @a ~ ~ ~ 5 1"' \
            '\t\texecute console command "bossbar list"' \
            '\t\texecute console command "bossbar remove %{_bar}%"' \
            '\t\texplotarNuclear({_l}, {_p})' \
            '\t\twait 3 seconds' \
            '\t\tset {_aire} to 0' \
            '\t\tloop blocks in radius 6 of {_l}:' \
            '\t\t\tif loop-block is air:' \
            '\t\t\t\tadd 1 to {_aire}' \
            '\t\tbroadcast "NUCLEAR_PRUEBA chancho vivo: %{_p} is alive% | aire cerca: %{_aire}%"' > plugins/Skript/scripts/zz_prueba.sk
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > server.properties
          ls -la . plugins
      - name: Arrancar y cargar los scripts
        run: |
          cd srv
          (sleep 120; echo "gulag llaves 5"; sleep 2; echo "gulag estado"; sleep 2; echo "gulag puertas"; sleep 2; echo "gulag lista"; sleep 3; echo "probarnuclear"; sleep 20; echo stop) | timeout 300 java -Xmx2G -jar paper.jar --nogui > log.txt 2>&1 || true
          # todo lo de Skript sale como aviso para poder leerlo desde afuera
          # todos los problemas de Skript juntos en un solo aviso (GitHub corta a 10 avisos por paso)
          M=$( { grep -A2 "\.sk)" log.txt | grep -vE "^--$" | sed -E 's/^\[[0-9:]+ INFO\]: +//' | grep -vE "^Line: " | tr '\n' ' ' | sed 's/\[Skript\]/\n/g' | head -c 60000 | tr '\n' '#'; } || true)
          [ -n "$M" ] && echo "::warning::${M//%/%25}"
          grep -iE "loaded [0-9]+ scripts?|encountered" log.txt | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          grep -q "Done (" log.txt || { tail -40 log.txt | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; exit 1; }
          if grep -q "\.sk)" log.txt; then echo "::error::Hay problemas en los scripts (ver el aviso)"; exit 1; fi
          grep -E "GULAG|gulag" log.txt | grep -vE "\.sk|Loading|Line" | tail -8 | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          grep -E "NUCLEAR_PRUEBA|bossbar|Exception|error" log.txt | grep -v "\.sk)" | head -8 | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          echo "::notice::Scripts sin errores"
