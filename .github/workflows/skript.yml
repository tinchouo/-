name: Probar scripts
on:
  push:
    paths: ['skripts/**', '.github/workflows/skript.yml', '.github/pruebas/**']
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skript: ['2.14.1', '2.15.1', '2.16.1']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Bajar Paper 1.21.4 y Skript
        run: |
          mkdir srv && cd srv
          J=$(curl -s -H "User-Agent: tod4-ci" https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds)
          URL=$(echo "$J" | jq -r 'max_by(.id) | .downloads."server:default".url' 2>/dev/null)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then echo "::error::No pude obtener Paper: ${J:0:300}"; exit 1; fi
          curl -sL -o paper.jar "$URL"
          mkdir -p plugins/Skript/scripts
          R=$(curl -s https://api.github.com/repos/SkriptLang/Skript/releases/tags/${{ matrix.skript }})
          U=$(echo "$R" | jq -r '.assets[] | select(.name|endswith(".jar")) | .browser_download_url' | head -1)
          if [ -z "$U" ]; then echo "::error::No pude obtener Skript"; exit 1; fi
          echo "::notice::Paper $URL | Skript $U"
          curl -sL -o plugins/Skript.jar "$U"
          cp ../skripts/*.sk plugins/Skript/scripts/
          # prueba de la explosion del Creeper Nuclear con ruedas (creeper_nuclear.sk)
          cp ../.github/pruebas/zz_prueba.sk plugins/Skript/scripts/
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > server.properties
          ls -la . plugins
      - name: Arrancar y cargar los scripts
        run: |
          cd srv
          (sleep 120; echo "gulag llaves 5"; sleep 2; echo "gulag estado"; sleep 2; echo "gulag puertas"; sleep 2; echo "gulag lista"; sleep 3; echo "probarnuclear"; sleep 8; echo "probarbloques"; sleep 6; echo "probarver"; sleep 6; echo "probarbj"; sleep 2; echo stop) | timeout 300 java -Xmx2G -jar paper.jar --nogui > log.txt 2>&1 || true
          # todo lo de Skript sale como aviso para poder leerlo desde afuera
          # todos los problemas de Skript juntos en un solo aviso (GitHub corta a 10 avisos por paso)
          M=$( { grep -A2 "\.sk)" log.txt | grep -vE "^--$" | sed -E 's/^\[[0-9:]+ INFO\]: +//' | grep -vE "^Line: " | tr '\n' ' ' | sed 's/\[Skript\]/\n/g' | head -c 60000 | tr '\n' '#'; } || true)
          [ -n "$M" ] && echo "::warning::${M//%/%25}"
          grep -iE "loaded [0-9]+ scripts?|encountered" log.txt | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          grep -q "Done (" log.txt || { tail -40 log.txt | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; exit 1; }
          grep -iE "NUCLEAR_PRUEBA|bossbar|Exception|error|invalid|unknown|incorrect|expected|skript.*version" log.txt | grep -v "\.sk)" | grep -v "No key layers" | head -14 | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          if grep -q "\.sk)" log.txt; then echo "::error::Hay problemas en los scripts (ver el aviso)"; exit 1; fi
          grep -E "BLOQUES_PRUEBA|ZONA_PRUEBA|VER_" log.txt | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          grep -q "BLOQUES_PRUEBA OK" log.txt || { echo "::error::Los bloques no volvieron igual"; exit 1; }
          grep -q "VER_PRUEBA OK" log.txt || { echo "::error::/nuclear ver movio lo guardado"; exit 1; }
          grep -q "ZONA_PRUEBA OK" log.txt || { echo "::error::La zona segura no anda"; exit 1; }
          grep -q "NUCLEAR_PRUEBA no rompio nada" log.txt || { echo "::error::La explosion del Creeper Nuclear rompio bloques (o no corrio la prueba)"; exit 1; }
          grep -E "GULAG|gulag" log.txt | grep -vE "\.sk|Loading|Line" | tail -8 | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          grep -E "BJ_PRUEBA" log.txt | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
          grep -q "BJ_PRUEBA totales 21 21 24 16" log.txt || { echo "::error::El blackjack suma mal"; exit 1; }
          grep -q "BJ_PRUEBA cartas 10 7" log.txt || { echo "::error::Las cartas del blackjack no tienen la cantidad bien"; exit 1; }
          echo "::notice::Scripts sin errores"
