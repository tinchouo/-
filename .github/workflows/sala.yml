name: TOD5 prueba sala de espera
on:
  push:
    branches: [tod5-menu]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sala:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-apps imagemagick xdotool mesa-utils libgl1-mesa-dri mesa-vulkan-drivers pulseaudio jq >/dev/null
      - name: Compilar plugin
        run: |
          PV=$(curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -o '<version>26\.3[^<]*</version>' | sed 's/<[^>]*>//g' | grep -E '^26\.3\.build\.[0-9]+-alpha$' | sort -V | tail -1)
          echo "paper-api: $PV" | tee plugin.log
          ./gradlew -p servidor build -Ppaper_version="$PV" 2>&1 | tee -a plugin.log
          ls servidor/build/libs/
      - name: Preparar server Paper 26.3 (todavia apagado)
        run: |
          mkdir -p srv/plugins && cp servidor/build/libs/tod5-servidor-*.jar srv/plugins/
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest | jq -r '.downloads["server:default"].url')
          echo "paper: $URL" | tee -a plugin.log
          curl -sL "$URL" -o srv/paper.jar
          cd srv && echo "eula=true" > eula.txt
          printf 'white-list=false\nenforce-whitelist=false\nonline-mode=false\nenforce-secure-profile=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\n' > server.properties
          touch cmds.txt
      - name: Prueba completa
        run: |
          mkdir -p run cap
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nguiScale:2\n' > run/options.txt
          pulseaudio --start --exit-idle-time=-1 || true
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset & sleep 2
          export DISPLAY=:99
          L=run/logs/latest.log
          espera() { for i in $(seq 1 $2); do grep -q "$1" $L 2>/dev/null && return 0; sleep 1; done; echo "NO LLEGO: $1"; }
          # 1) el juego abre con el server APAGADO y aprieto JUGAR
          (env -u CI ./gradlew runClient -Ptod5_ip=localhost -Ptod5_debug --stacktrace > juego.log 2>&1 &)
          espera "TOD5 menu abierto" 420; sleep 9; import -window root cap/0_menu.png
          xdotool mousemove 640 438; sleep 0.3; xdotool click 1; sleep 0.5; import -window root cap/1_conectando.png
          sleep 7; xdotool mousemove 100 100; import -window root cap/2_cerrado.png
          # 2) se prende el server (en preparacion): intenta entrar, lo rechaza (no es OP) y queda en la cola
          (cd srv && tail -f cmds.txt | java -Xmx2G -jar paper.jar nogui > server.log 2>&1 &)
          for i in $(seq 1 240); do grep -q "Done (" srv/server.log && break; sleep 1; done; echo "difficulty peaceful" >> srv/cmds.txt
          espera "intento entrar (por si soy OP)" 30; sleep 12; import -window root cap/3_preparacion.png
          echo "tod estado" >> srv/cmds.txt; sleep 2
          # 3) se abre: SERVIDOR ABIERTO, suena el aviso, 3 s despues de que termina entra solo
          echo "tod abrir" >> srv/cmds.txt
          espera "el server abrio: sonido" 20; sleep 2; import -window root cap/4_abierto.png
          espera "saludo enviado" 60; sleep 8; import -window root cap/5_adentro.png
          # 4) como OP entra directo aunque este en preparacion
          N=$(grep -o "UUID of player [A-Za-z0-9_]*" srv/server.log | tail -1 | awk '{print $4}'); echo "jugador: $N"
          echo "op $N" >> srv/cmds.txt; echo "tod cerrar" >> srv/cmds.txt; sleep 2
          echo "kick @a Prueba" >> srv/cmds.txt; sleep 4; import -window root cap/6_echado.png
          xdotool mousemove 640 416 click 1; sleep 4; import -window root cap/7_menu_otra_vez.png
          xdotool mousemove 640 438 click 1
          sleep 25; import -window root cap/8_op_adentro.png
          # 5) la tablet: J, cada seccion, hover y clic en crafteos, y J para cerrar
          W=$(xdotool getmousewindow 2>/dev/null || true); echo "ventana: $W, foco: $(xdotool getwindowfocus 2>/dev/null || true)"; xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 3; grep 'tecla tablet' $L || echo 'NO LLEGO LA TECLA'; grep -c 'llego una tecla' $L || true; grep 'tecla de la tablet' $L || true; xdotool key e; sleep 2; import -window root cap/t0_inventario.png; xdotool key Escape; sleep 1; grep -c 'llego una tecla' $L || true; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 3; grep 'tecla tablet' $L || echo 'TAMPOCO'; import -window root cap/t1_inicio.png
          xdotool mousemove 224 204 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t2_novedades.png
          xdotool mousemove 224 268 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t3_misiones.png; xdotool mousemove 976 328 click 1; sleep 1; xdotool mousemove 972 228 click 1; sleep 1; xdotool mousemove 1000 360; sleep 1; import -window root cap/t3b_recompensas.png
          xdotool mousemove 224 332 click 1; sleep 2; xdotool mousemove 294 170; sleep 1.5; import -window root cap/t4_crafteos_hover.png
          xdotool mousemove 330 170 click 1; sleep 1; xdotool mousemove 1200 700; sleep 1; import -window root cap/t5_crafteo_todarmor.png
          xdotool mousemove 224 396 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t6_equipo.png
          xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2; import -window root cap/t7_cerrada.png; grep 'tecla tablet' $L || true
          echo "tod estado" >> srv/cmds.txt; sleep 2
          pkill -f net.fabricmc || true; echo "stop" >> srv/cmds.txt; sleep 5
      - name: Subir capturas y logs
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r cap /tmp/out/ 2>/dev/null || true
          cp plugin.log juego.log /tmp/out/ 2>/dev/null || true; cp run/logs/latest.log /tmp/out/mc.log 2>/dev/null || true
          cp srv/server.log /tmp/out/server.log 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b log
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "sala $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" log:ci-sala-tod5
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tod5-plugin-servidor
          path: servidor/build/libs/*.jar
