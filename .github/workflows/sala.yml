name: TOD5 prueba sala de espera
on:
  push:
    branches: [tod5-menu]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sala:
    if: "!contains(github.event.head_commit.message, '[ref]') && !contains(github.event.head_commit.message, '[wip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-apps imagemagick xdotool mesa-utils libgl1-mesa-dri mesa-vulkan-drivers pulseaudio jq ffmpeg >/dev/null
      - name: Compilar plugin
        run: |
          PV=1.21.11-R0.1-SNAPSHOT
          echo "paper-api: $PV" | tee plugin.log
          ./gradlew -p servidor build -Ppaper_version="$PV" 2>&1 | tee -a plugin.log
          ls servidor/build/libs/
      - name: Preparar server Paper 1.21.11 (todavia apagado)
        run: |
          mkdir -p srv/plugins && cp servidor/build/libs/tod5-servidor-*.jar srv/plugins/
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest | jq -r '.downloads["server:default"].url')
          echo "paper: $URL" | tee -a plugin.log
          curl -sL "$URL" -o srv/paper.jar
          cd srv && echo "eula=true" > eula.txt
          printf 'white-list=false\nenforce-whitelist=false\nonline-mode=false\nenforce-secure-profile=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\n' > server.properties
          touch cmds.txt
      - name: Prueba completa
        run: |
          mkdir -p run cap
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nguiScale:2\n' > run/options.txt
          pulseaudio --start --exit-idle-time=-1 || true
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset & sleep 2
          export DISPLAY=:99
          L=run/logs/latest.log
          espera() { for i in $(seq 1 $2); do grep -q "$1" $L 2>/dev/null && return 0; sleep 1; done; echo "NO LLEGO: $1"; }
          # 1) el juego abre con el server APAGADO y aprieto JUGAR
          (env -u CI ./gradlew runClient -Ptod5_ip=localhost -Ptod5_debug --stacktrace > juego.log 2>&1 &)
          espera "TOD5 menu abierto" 420; sleep 9; import -window root cap/0_menu.png
          xdotool mousemove 640 438; sleep 0.3; xdotool click 1; sleep 0.5; import -window root cap/1_conectando.png
          sleep 7; xdotool mousemove 100 100; import -window root cap/2_cerrado.png
          # 2) se prende el server (en preparacion): intenta entrar, lo rechaza (no es OP) y queda en la cola
          (cd srv && tail -f cmds.txt | java -Xmx2G -jar paper.jar nogui > server.log 2>&1 &)
          for i in $(seq 1 240); do grep -q "Done (" srv/server.log && break; sleep 1; done; echo "difficulty peaceful" >> srv/cmds.txt
          espera "intento entrar (por si soy OP)" 30; sleep 12; import -window root cap/3_preparacion.png
          echo "tod estado" >> srv/cmds.txt; sleep 2
          # 3) se abre: SERVIDOR ABIERTO, suena el aviso, 3 s despues de que termina entra solo
          echo "tod abrir" >> srv/cmds.txt
          espera "el server abrio: sonido" 20; sleep 2; import -window root cap/4_abierto.png
          espera "saludo enviado" 60; sleep 8; import -window root cap/5_adentro.png
          # 4) como OP entra directo aunque este en preparacion
          N=$(grep -o "UUID of player [A-Za-z0-9_]*" srv/server.log | tail -1 | awk '{print $4}'); echo "jugador: $N"
          echo "op $N" >> srv/cmds.txt; echo "tod cerrar" >> srv/cmds.txt; sleep 2
          echo "kick @a Prueba" >> srv/cmds.txt; sleep 4; import -window root cap/6_echado.png
          xdotool mousemove 640 416 click 1; sleep 4; import -window root cap/7_menu_otra_vez.png
          xdotool mousemove 640 438 click 1
          sleep 25; import -window root cap/8_op_adentro.png
          # 5) sistema de la tablet: editor, anuncios con colores, crafteo oculto
          echo "tod editor agregar $N" >> srv/cmds.txt; sleep 2
          # la ruleta: la grabo en video (con sonido) mientras sale el primer anuncio
          MON="$(pactl get-default-sink 2>/dev/null).monitor"; echo "audio: $MON"
          (ffmpeg -v error -y -f x11grab -video_size 1280x720 -framerate 30 -i :99 -f pulse -i "$MON" -t 12 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac cap/ruleta.mp4 > ffmpeg.log 2>&1 || ffmpeg -v error -y -f x11grab -video_size 1280x720 -framerate 30 -i :99 -t 12 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p cap/ruleta.mp4 >> ffmpeg.log 2>&1) &
          sleep 0.5; echo "tod anuncio cambio Los creepers dejan veneno al morir." >> srv/cmds.txt
          echo "tod anuncio aviso Hoy a las 20:00 hay evento en el Nether." >> srv/cmds.txt
          echo "tod anuncio truco Todos con un solo corazón por 10 minutos." >> srv/cmds.txt
          echo "tod anuncio dungeon NUEVA DIMENSIÓN | Se abrió el Aether." >> srv/cmds.txt
          sleep 3; import -window root cap/r1_girando.png; sleep 3.6; import -window root cap/r2_eligio.png; sleep 3.5; import -window root cap/r3_chat.png
          cat ffmpeg.log || true; sleep 26; import -window root cap/c1_chat.png
          echo "tod crafteo ocultar billetera" >> srv/cmds.txt; sleep 2
          # 6) la tablet: J, secciones, y en Crafteos el modo edicion: marcar la billetera y activarla
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 3; grep 'tecla tablet' $L || echo 'NO LLEGO LA TECLA'; import -window root cap/t1_inicio.png
          xdotool mousemove 224 204 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t2_novedades.png
          xdotool mousemove 224 268 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t3_misiones.png
          xdotool mousemove 224 332 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t4_crafteos_vacio.png
          xdotool mousemove 1032 128 click 1; sleep 1; xdotool mousemove 1200 700; sleep 1; import -window root cap/t5_editando.png
          xdotool mousemove 294 170 click 1; sleep 1; xdotool mousemove 1200 700; sleep 1; import -window root cap/t6_marcado.png
          xdotool mousemove 340 318 click 1; sleep 3; xdotool mousemove 1200 700; sleep 1; import -window root cap/t7_activado.png
          xdotool mousemove 1040 128 click 1; sleep 1; xdotool mousemove 294 170; sleep 1; import -window root cap/t8_listo.png
          xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 9; import -window root cap/t9_chat.png
          # 7) modo admin: un anuncio nuevo desde la tablet (texto con negrita y color), y se envia a todos
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 1050 88 click 1; sleep 1; xdotool mousemove 1200 700; sleep 1; import -window root cap/a1_admin.png
          xdotool mousemove 462 128 click 1; sleep 2                       # + Nuevo
          xdotool mousemove 752 130 click 1; sleep 0.5                     # tipo naranja (cambio de dificultad)
          xdotool mousemove 800 320 click 1; sleep 0.3                     # al cuadro de texto
          xdotool type --delay 40 "Desde hoy, los creepers "
          xdotool mousemove 520 236 click 1; xdotool mousemove 668 236 click 1; sleep 0.2 # negrita + blanco
          xdotool type --delay 40 "dejan veneno"
          xdotool mousemove 520 236 click 1; xdotool mousemove 644 236 click 1; sleep 0.2 # sin negrita, color normal
          xdotool type --delay 40 " al morir. Usa escudo o quedate lejos hasta el dia 4, porque el veneno dura bastante."
          xdotool key ctrl+shift+Left; sleep 0.2; xdotool mousemove 580 236 click 1; sleep 0.3   # ultima palabra subrayada
          xdotool mousemove 1200 700; sleep 1; import -window root cap/a2_editando.png
          xdotool mousemove 916 236 click 1; sleep 0.6; import -window root cap/a2b_simbolos.png; xdotool mousemove 916 236 click 1; sleep 0.3
          xdotool mousemove 556 604 click 1; sleep 2; import -window root cap/a3_guardado.png    # Guardar
          xdotool mousemove 776 604 click 1; sleep 0.6; xdotool mousemove 776 604 click 1       # Enviar a todos (2 clics)
          sleep 0.5; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 1.5; xdotool mousemove 1200 700; import -window root cap/a3b_enviado_ya.png; xdotool key Escape
          sleep 3; import -window root cap/a4_ruleta.png; sleep 7; import -window root cap/a5_chat.png
          # 8) retirar: abro el anuncio enviado, Retirar (2 clics) y tiene que volver a borrador y salir de las novedades
          cat srv/plugins/TOD5/datos/novedades.yml 2>/dev/null | tail -8 || true
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 376 196 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/a6_abierto.png
          xdotool mousemove 776 604 click 1; sleep 0.6; xdotool mousemove 776 604 click 1; sleep 2; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/a7_retirado.png
          grep -E "retiro el anuncio" srv/server.log || echo "NO SE RETIRO"
          cat srv/plugins/TOD5/datos/novedades.yml 2>/dev/null | tail -8 || true
          xdotool key Escape; sleep 1
          cat srv/plugins/TOD5/datos/anuncios.json 2>/dev/null | head -60 || true
          grep -E "TOD5 tablet:" $L | tail -5 || true; grep -E "activo crafteos|Tablet:|envio el anuncio" srv/server.log || true
          # 9) las monedas: en la mano (mitad de tamaño) y en el inventario
          for m in amarilla roja morada ficha; do echo "tod moneda $m 12 $N" >> srv/cmds.txt; done; sleep 2
          xdotool key 1; sleep 1; xdotool mousemove 1200 700; import -window root cap/m1_mano.png
          xdotool key 4; sleep 1; import -window root cap/m2_ficha_mano.png
          xdotool key e; sleep 1.5; import -window root cap/m3_inventario.png; xdotool key Escape; sleep 1
          # 10) la pestaña Trucofdeath del creativo (solo mirar: el server no conoce los items del mod)
          echo "gamemode creative $N" >> srv/cmds.txt; sleep 2
          xdotool key e; sleep 2; xdotool mousemove 1200 700; import -window root cap/k1_creativo.png
          xdotool mousemove 806 196 click 1; sleep 1; xdotool type --delay 60 "oin"; sleep 1; xdotool mousemove 1200 700; import -window root cap/k2_buscar_oin.png
          xdotool key ctrl+a; xdotool type --delay 60 "truquita"; sleep 1; import -window root cap/k3_buscar_truquita.png
          xdotool key Escape; sleep 1
          echo "tod estado" >> srv/cmds.txt; sleep 2
          pkill -f net.fabricmc || true; echo "stop" >> srv/cmds.txt; sleep 5
      - name: Subir capturas y logs
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r cap /tmp/out/ 2>/dev/null || true
          cp plugin.log juego.log /tmp/out/ 2>/dev/null || true; cp run/logs/latest.log /tmp/out/mc.log 2>/dev/null || true
          cp srv/server.log /tmp/out/server.log 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b log
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "sala $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" log:ci-sala-tod5
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tod5-plugin-servidor
          path: servidor/build/libs/*.jar
