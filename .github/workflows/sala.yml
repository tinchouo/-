name: TOD5 prueba sala de espera
on:
  push:
    branches: [tod5-menu]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sala:
    if: "!contains(github.event.head_commit.message, '[ref]') && !contains(github.event.head_commit.message, '[wip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-apps imagemagick xdotool mesa-utils libgl1-mesa-dri mesa-vulkan-drivers pulseaudio jq ffmpeg >/dev/null
      - name: Compilar plugin
        run: |
          PV=1.21.11-R0.1-SNAPSHOT
          echo "paper-api: $PV" | tee plugin.log
          ./gradlew -p servidor build -Ppaper_version="$PV" 2>&1 | tee -a plugin.log
          ls servidor/build/libs/
      - name: Preparar server Paper 1.21.11 (todavia apagado)
        run: |
          mkdir -p srv/plugins && cp servidor/build/libs/tod5-servidor-*.jar srv/plugins/
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest | jq -r '.downloads["server:default"].url')
          echo "paper: $URL" | tee -a plugin.log
          curl -sL "$URL" -o srv/paper.jar
          cd srv && echo "eula=true" > eula.txt
          printf 'white-list=false\nenforce-whitelist=false\nonline-mode=false\nenforce-secure-profile=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\n' > server.properties
          touch cmds.txt
      - name: Prueba completa
        run: |
          mkdir -p run cap
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nguiScale:2\n' > run/options.txt
          pulseaudio --start --exit-idle-time=-1 || true
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset & sleep 2
          export DISPLAY=:99
          L=run/logs/latest.log
          espera() { for i in $(seq 1 $2); do grep -q "$1" $L 2>/dev/null && return 0; sleep 1; done; echo "NO LLEGO: $1"; }
          # 1) el juego abre con el server APAGADO y aprieto JUGAR
          (env -u CI ./gradlew runClient -Ptod5_ip=localhost -Ptod5_debug --stacktrace > juego.log 2>&1 &)
          espera "TOD5 menu abierto" 420; sleep 9; import -window root cap/0_menu.png
          xdotool mousemove 640 438; sleep 0.3; xdotool click 1; sleep 0.5; import -window root cap/1_conectando.png
          sleep 7; xdotool mousemove 100 100; import -window root cap/2_cerrado.png
          # 2) se prende el server (en preparacion): intenta entrar, lo rechaza (no es OP) y queda en la cola
          (cd srv && tail -f cmds.txt | java -Xmx2G -jar paper.jar nogui > server.log 2>&1 &)
          for i in $(seq 1 240); do grep -q "Done (" srv/server.log && break; sleep 1; done; echo "difficulty peaceful" >> srv/cmds.txt
          espera "intento entrar (por si soy OP)" 30; sleep 12; import -window root cap/3_preparacion.png
          echo "tod estado" >> srv/cmds.txt; sleep 2
          # 3) se abre: SERVIDOR ABIERTO, suena el aviso, 3 s despues de que termina entra solo
          echo "tod abrir" >> srv/cmds.txt
          espera "el server abrio: sonido" 20; sleep 2; import -window root cap/4_abierto.png
          espera "saludo enviado" 60; sleep 8; import -window root cap/5_adentro.png
          # 4) como OP entra directo aunque este en preparacion
          N=$(grep -o "UUID of player [A-Za-z0-9_]*" srv/server.log | tail -1 | awk '{print $4}'); echo "jugador: $N"
          echo "op $N" >> srv/cmds.txt; echo "tod cerrar" >> srv/cmds.txt; sleep 2
          echo "kick @a Prueba" >> srv/cmds.txt; sleep 4; import -window root cap/6_echado.png
          xdotool mousemove 640 416 click 1; sleep 4; import -window root cap/7_menu_otra_vez.png
          xdotool mousemove 640 438 click 1
          sleep 25; import -window root cap/8_op_adentro.png
          # 4b) SIN ser editor: recien entrado, la tablet tiene que mostrar lo del server (no los datos de ejemplo)
          grep -n "datos del server" run/logs/latest.log | tail -3 || echo "NO LLEGARON LOS DATOS AL ENTRAR"
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2; xdotool mousemove 1200 700; import -window root cap/e0_no_editor_inicio.png
          xdotool mousemove 224 268 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/e1_no_editor_misiones.png
          xdotool mousemove 224 332 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/e2_no_editor_crafteos.png
          xdotool key Escape; sleep 1
          # 5) sistema de la tablet: editor, anuncios con colores, crafteo oculto
          echo "tod editor agregar $N" >> srv/cmds.txt; sleep 2
          # la ruleta: la grabo en video (con sonido) mientras sale el primer anuncio
          MON="$(pactl get-default-sink 2>/dev/null).monitor"; echo "audio: $MON"
          (ffmpeg -v error -y -f x11grab -video_size 1280x720 -framerate 30 -i :99 -f pulse -i "$MON" -t 12 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac cap/ruleta.mp4 > ffmpeg.log 2>&1 || ffmpeg -v error -y -f x11grab -video_size 1280x720 -framerate 30 -i :99 -t 12 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p cap/ruleta.mp4 >> ffmpeg.log 2>&1) &
          sleep 0.5; echo "tod anuncio cambio Los creepers dejan veneno al morir." >> srv/cmds.txt
          echo "tod anuncio aviso Hoy a las 20:00 hay evento en el Nether." >> srv/cmds.txt
          echo "tod anuncio truco Todos con un solo corazón por 10 minutos." >> srv/cmds.txt
          echo "tod anuncio dungeon NUEVA DIMENSIÓN | Se abrió el Aether." >> srv/cmds.txt
          sleep 3; import -window root cap/r1_girando.png; sleep 3.6; import -window root cap/r2_eligio.png; sleep 3.5; import -window root cap/r3_chat.png
          cat ffmpeg.log || true; sleep 26; import -window root cap/c1_chat.png
          echo "tod crafteo ocultar billetera" >> srv/cmds.txt; sleep 2
          # 6) la tablet: J, secciones, y en Crafteos el modo edicion: marcar la billetera y activarla
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 3; grep 'tecla tablet' $L || echo 'NO LLEGO LA TECLA'; import -window root cap/t1_inicio.png
          xdotool mousemove 224 204 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t2_novedades.png
          xdotool mousemove 224 268 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t3_misiones.png
          xdotool mousemove 224 332 click 1; sleep 2; xdotool mousemove 1200 700; sleep 1; import -window root cap/t4_crafteos_vacio.png
          xdotool mousemove 1032 128 click 1; sleep 1; xdotool mousemove 1200 700; sleep 1; import -window root cap/t5_editando.png
          xdotool mousemove 294 170 click 1; sleep 1; xdotool mousemove 1200 700; sleep 1; import -window root cap/t6_marcado.png
          xdotool mousemove 340 318 click 1; sleep 3; xdotool mousemove 1200 700; sleep 1; import -window root cap/t7_activado.png
          xdotool mousemove 1040 128 click 1; sleep 1; xdotool mousemove 294 170; sleep 1; import -window root cap/t8_listo.png
          xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 9; import -window root cap/t9_chat.png
          # 7) modo admin: un anuncio nuevo desde la tablet (texto con negrita y color), y se envia a todos
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 1050 88 click 1; sleep 1; xdotool mousemove 1200 700; sleep 1; import -window root cap/a1_admin.png
          xdotool mousemove 462 128 click 1; sleep 2                       # + Nuevo
          xdotool mousemove 752 130 click 1; sleep 0.5                     # tipo naranja (cambio de dificultad)
          xdotool mousemove 800 320 click 1; sleep 0.3                     # al cuadro de texto
          xdotool type --delay 40 "Desde hoy, los creepers "
          xdotool mousemove 520 236 click 1; xdotool mousemove 668 236 click 1; sleep 0.2 # negrita + blanco
          xdotool type --delay 40 "dejan veneno"
          xdotool mousemove 520 236 click 1; xdotool mousemove 644 236 click 1; sleep 0.2 # sin negrita, color normal
          xdotool type --delay 40 " al morir. Usa escudo o quedate lejos hasta el dia 4, porque el veneno dura bastante."
          xdotool key ctrl+shift+Left; sleep 0.2; xdotool mousemove 580 236 click 1; sleep 0.3   # ultima palabra subrayada
          xdotool mousemove 1200 700; sleep 1; import -window root cap/a2_editando.png
          xdotool mousemove 916 236 click 1; sleep 0.6; import -window root cap/a2b_simbolos.png; xdotool mousemove 916 236 click 1; sleep 0.3
          xdotool mousemove 556 604 click 1; sleep 2; import -window root cap/a3_guardado.png    # Guardar
          xdotool mousemove 776 604 click 1; sleep 0.6; xdotool mousemove 776 604 click 1       # Enviar a todos (2 clics)
          sleep 0.5; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 1.5; xdotool mousemove 1200 700; import -window root cap/a3b_enviado_ya.png; xdotool key Escape
          sleep 3; import -window root cap/a4_ruleta.png; sleep 7; import -window root cap/a5_chat.png
          # 8) retirar: abro el anuncio enviado, Retirar (2 clics) y tiene que volver a borrador y salir de las novedades
          cat srv/plugins/TOD5/datos/novedades.yml 2>/dev/null | tail -8 || true
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 376 196 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/a6_abierto.png
          xdotool mousemove 776 604 click 1; sleep 0.6; xdotool mousemove 776 604 click 1; sleep 2; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/a7_retirado.png
          grep -E "retiro el anuncio" srv/server.log || echo "NO SE RETIRO"
          cat srv/plugins/TOD5/datos/novedades.yml 2>/dev/null | tail -8 || true
          xdotool key Escape; sleep 1
          cat srv/plugins/TOD5/datos/anuncios.json 2>/dev/null | head -60 || true
          grep -E "TOD5 tablet:" $L | tail -5 || true; grep -E "activo crafteos|Tablet:|envio el anuncio" srv/server.log || true
          # 9) las monedas: en la mano (mitad de tamaño) y en el inventario
          for m in trucoin fracoin tinchoin truquita; do echo "tod moneda $m 12 $N" >> srv/cmds.txt; done; sleep 2
          xdotool key 1; sleep 1; xdotool mousemove 1200 700; import -window root cap/m1_mano.png
          xdotool key 4; sleep 1; import -window root cap/m2_ficha_mano.png
          xdotool key e; sleep 1.5; import -window root cap/m3_inventario.png; xdotool key Escape; sleep 1
          # 10) la pestaña Trucofdeath del creativo (pagina 2) y sacar una moneda (el server no te tiene que echar)
          echo "gamemode creative $N" >> srv/cmds.txt; sleep 2
          xdotool key e; sleep 2; xdotool mousemove 1200 700; import -window root cap/k1_creativo.png
          xdotool mousemove 815 243 click 1; sleep 1; xdotool mousemove 1200 700; import -window root cap/k2_pagina2.png
          xdotool mousemove 470 200 click 1; sleep 1; xdotool mousemove 1200 700; import -window root cap/k3_pestana.png
          xdotool mousemove 477 276 click 1; sleep 0.5; xdotool mousemove 660 463 click 1; sleep 1; xdotool mousemove 1200 700; import -window root cap/k4_sacada.png
          xdotool key Escape; sleep 2; import -window root cap/k5_sigo_adentro.png
          grep -iE "disconnect|lost connection|kicked" srv/server.log | tail -3 || true
          # 11) zona de monedas: area automatica (aparecen antes de llegar), progreso que no se pierde, recompensa en la bandeja
          echo "gamemode survival $N" >> srv/cmds.txt; echo "tp $N 0.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2
          echo "tod zona crear prueba 4 $N" >> srv/cmds.txt; echo "give $N diamond 3" >> srv/cmds.txt; sleep 1
          for d in "3 0 0" "5 0 0" "7 0 0" "9 1 0" "12 0 0"; do echo "tod zona moneda prueba $N $d" >> srv/cmds.txt; done
          echo "tod zona premioprueba prueba $N" >> srv/cmds.txt; sleep 1
          echo "tp $N -8.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2; import -window root cap/z0_afuera.png
          echo "tp $N 0.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2; import -window root cap/z1_aparecen_antes.png
          echo "tp $N 3.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 0.7; import -window root cap/z2_una.png
          echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 1.5; import -window root cap/z3_salgo.png
          echo "tp $N 0.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2; import -window root cap/z4_vuelvo_sigue_1.png
          for x in 5.5 7.5 9.5; do echo "tp $N $x -60 0.5 -90 10" >> srv/cmds.txt; sleep 0.6; done; import -window root cap/z5_desde_el_piso.png
          echo "tp $N 12.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 1.2; import -window root cap/z6_completa_aviso.png
          grep -iE "completo la zona" srv/server.log || echo "NO SE COMPLETO"
          cat srv/plugins/TOD5/datos/zonas_progreso.json 2>/dev/null | head -20 || true
          # la bandeja: pestaña Recompensas en la tablet, abrir el cofre, sacar uno y cerrar con el item en la mano (vuelve)
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 1050 88 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/z7_tablet_pestana.png
          xdotool mousemove 224 396 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/z8_recompensas.png
          xdotool mousemove 862 195 click 1; sleep 2; xdotool mousemove 1200 700; import -window root cap/z9_cofre.png
          xdotool mousemove 496 226 click 1; sleep 0.5; xdotool mousemove 700 500; sleep 0.3; import -window root cap/z10_en_la_mano.png
          xdotool key Escape; sleep 1.5; import -window root cap/z11_cerrado.png
          cat srv/plugins/TOD5/datos/recompensas.json 2>/dev/null | head -30 || true
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 224 396 click 1; sleep 1; xdotool mousemove 984 195 click 1; sleep 2; xdotool mousemove 1200 700; import -window root cap/z11b_reclamado.png
          xdotool key Escape; sleep 1
          cat srv/plugins/TOD5/datos/recompensas.json 2>/dev/null | head -10 || echo "bandeja vacia"
          xdotool key e; sleep 1.5; import -window root cap/z12_inventario.png; xdotool key Escape; sleep 1
          # modo "siempre" + activacion por comando: sin activar no aparecen; al activar, si
          echo "tod zona modo prueba siempre" >> srv/cmds.txt; echo "tod zona activacion prueba comando" >> srv/cmds.txt
          echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 1.5; echo "tp $N 0.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2; import -window root cap/z13_sin_activar.png
          echo "tod zona activar prueba $N" >> srv/cmds.txt; sleep 1.5; import -window root cap/z14_activada.png
          grep -iE "zona|moneda|recompensa" srv/server.log | tail -10 || true
          # dejo el inventario como antes (para los crafteos) y la tablet en modo admin
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2; xdotool mousemove 1050 88 click 1; sleep 1; xdotool key Escape; sleep 1
          echo "clear $N" >> srv/cmds.txt; for m in trucoin fracoin tinchoin truquita; do echo "tod moneda $m 12 $N" >> srv/cmds.txt; done
          echo "tod zona crear prueba 4 $N" >> srv/cmds.txt; echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2
          # 12) crafteos: modo admin > Crafteos, uno nuevo, armar la receta en la mesa del server, activarlo y verlo en la tablet normal
          echo "gamemode creative $N" >> srv/cmds.txt; sleep 1
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 224 204 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/f1_admin_crafteos.png
          xdotool mousemove 462 128 click 1; sleep 2; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/f2_nuevo.png
          xdotool mousemove 788 334 click 1; sleep 2; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/f3_mesa.png
          xdotool mousemove 496 550 click 1; sleep 0.4; xdotool mousemove 534 228 click 1; sleep 0.3; xdotool mousemove 570 228 click 3; sleep 0.3
          xdotool mousemove 714 264 click 1; sleep 0.3; xdotool mousemove 496 550 click 1; sleep 0.4; xdotool mousemove 1200 700; sleep 0.3; import -window root cap/f4_receta.png
          xdotool mousemove 642 372 click 1; sleep 1.5; import -window root cap/f5_guardada.png
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 224 204 click 1; sleep 1; xdotool mousemove 376 238 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/f6_elegido.png
          xdotool mousemove 830 246 click 1; sleep 1.5; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/f7_activo.png
          xdotool mousemove 1050 88 click 1; sleep 1; xdotool mousemove 224 332 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/f8_tablet_normal.png
          xdotool key Escape; sleep 1
          # 13) hacer el crafteo en una mesa de verdad: 12 + 1 trucoin -> resultado; shift+clic
          echo "setblock 4 -60 0 crafting_table" >> srv/cmds.txt; echo "tp $N 2.5 -60 0.5 -90 40" >> srv/cmds.txt; sleep 2
          xdotool mousemove 640 360 click 3; sleep 1.5; xdotool mousemove 1200 700; import -window root cap/g1_mesa.png
          xdotool mousemove 496 494 click 1; sleep 0.3; xdotool mousemove 540 244 click 1; sleep 0.3
          xdotool mousemove 676 494 click 1; sleep 0.3; xdotool mousemove 576 244 click 1; sleep 0.6; xdotool mousemove 1200 700; import -window root cap/g2_resultado.png
          xdotool mousemove 728 280; xdotool keydown shift; xdotool click 1; xdotool keyup shift; sleep 0.8; xdotool mousemove 1200 700; import -window root cap/g3_shift.png
          xdotool key Escape; sleep 1
          cat srv/plugins/TOD5/datos/crafteos.json 2>/dev/null | head -40 || true
          # 14) misiones: dos sembradas (diaria con matar + evento; opcional de equipo con "ir"), progreso, completar y reclamar; despues el editor
          cat > srv/plugins/TOD5/datos/misiones.json <<'JSON'
          {"proximo":3,"misiones":[
           {"id":"m1","nombre":"Cazador de chanchos","clase":"diaria","estado":"activa","dia":1,"equipo":false,"objetivos":[
             {"uid":"a","tipo":"matar","clave":"pig","texto":"","cantidad":2,"mundo":"","x":0,"y":0,"z":0,"radio":6},
             {"uid":"b","tipo":"evento","clave":"","texto":"Saludá al admin","cantidad":1,"mundo":"","x":0,"y":0,"z":0,"radio":6}],"recompensa":[]},
           {"id":"m2","nombre":"Expedición","clase":"opcional","estado":"activa","dia":1,"equipo":true,"objetivos":[
             {"uid":"c","tipo":"ir","clave":"","texto":"el punto de encuentro","cantidad":1,"mundo":"world","x":80.5,"y":-60,"z":0.5,"radio":4}],"recompensa":[]}]}
          JSON
          echo "tod recargar" >> srv/cmds.txt; sleep 2; echo "tod mision premioprueba m1 $N" >> srv/cmds.txt; echo "tod mision lista" >> srv/cmds.txt
          echo "gamemode survival $N" >> srv/cmds.txt; echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 224 268 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/h1_misiones.png
          xdotool key Escape; sleep 1
          for i in 1 2; do echo "summon pig 62.5 -60 0.5 {NoAI:1b}" >> srv/cmds.txt; sleep 0.5; echo "execute as $N run damage @e[type=pig,limit=1,sort=nearest] 200 minecraft:player_attack by $N" >> srv/cmds.txt; sleep 1; done
          import -window root cap/h2_objetivo.png
          echo "tod mision completar m1 $N" >> srv/cmds.txt; sleep 1.5; import -window root cap/h3_completa.png
          echo "tp $N 80.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2.5; import -window root cap/h4_ir.png
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 224 268 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/h5_para_reclamar.png
          xdotool mousemove 1013 263 click 1; sleep 1.5; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/h6_reclamada.png
          cat srv/plugins/TOD5/datos/misiones_progreso.json 2>/dev/null | head -40 || true
          xdotool mousemove 1050 88 click 1; sleep 1; xdotool mousemove 224 332 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/h7_admin.png
          xdotool mousemove 376 194 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/h8_editor.png
          xdotool mousemove 1018 271 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/h9_objetivo_nuevo.png
          xdotool key Escape; sleep 1
          # 15) vinculos: la mision Expedicion se vincula a un anuncio desde SU panel; activarla manda el anuncio y ocultarla lo retira
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 376 264 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/v1_mision.png
          xdotool mousemove 650 237 click 1; sleep 1; import -window root cap/v2_selector.png
          xdotool mousemove 640 278 click 1; sleep 1.5; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/v3_vinculada.png
          xdotool mousemove 636 199 click 1; sleep 1.5; xdotool mousemove 722 199 click 1; sleep 0.5; xdotool key Escape
          sleep 12; import -window root cap/v4_salio.png
          grep -iE "vinculo|vinculado|anuncio" srv/server.log | tail -6 || true
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 376 264 click 1; sleep 1; xdotool mousemove 636 199 click 1; sleep 2; xdotool mousemove 1200 700; import -window root cap/v5_oculta.png
          grep -iE "retira" srv/server.log | tail -3 || echo "NO SE RETIRO EL ANUNCIO"
          xdotool mousemove 224 140 click 1; sleep 1; xdotool mousemove 376 196 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/v6_anuncio_activa.png
          xdotool key Escape; sleep 1
          cat srv/plugins/TOD5/datos/misiones.json | grep -o '"anuncio": *"[^"]*"' || true
          # 15b) al reves: mando el ANUNCIO desde su panel y la mision vinculada (oculta) se activa recien cuando termina la ruleta
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 224 140 click 1; sleep 1; xdotool mousemove 376 196 click 1; sleep 1
          xdotool mousemove 776 604 click 1; sleep 0.6; xdotool mousemove 776 604 click 1; sleep 1.5
          xdotool key Escape; sleep 1.5; import -window root cap/w1_girando.png
          sleep 9; import -window root cap/w2_salio.png
          grep -E "Anuncio .*: (mision|crafteo)" srv/server.log || echo "NO SE ACTIVO LO VINCULADO AL MANDAR EL ANUNCIO"
          xdotool mousemove 640 700; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 224 268 click 1; sleep 1; xdotool mousemove 376 264 click 1; sleep 1; xdotool mousemove 1200 700; sleep 0.5; import -window root cap/w3_mision_activa.png
          xdotool key Escape; sleep 1
          # 17) gravedad: un techo de piedra, /tod gravedad arriba -> cae al techo con la camara dada vuelta; tercera persona; salto
          echo "fill 55 -54 -6 66 -54 6 stone" >> srv/cmds.txt; echo "fill 62 -55 -1 62 -55 1 stone_slab[type=top]" >> srv/cmds.txt; echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 2
          echo "tod gravedad arriba $N" >> srv/cmds.txt; sleep 1; import -window root cap/x0_girando.png; sleep 3; import -window root cap/x1_techo.png
          grep -E "Gravedad (arriba|abajo)" srv/server.log | tail -2 || echo "NO CAMBIO LA GRAVEDAD"
          xdotool key F5; sleep 1.5; import -window root cap/x2_tercera.png; xdotool key F5; sleep 0.5; xdotool key F5; sleep 1
          xdotool keydown space; sleep 0.25; xdotool keyup space; sleep 0.15; import -window root cap/x3_salto.png; sleep 2
          # agachado cabeza abajo: camina al borde del techo (en x=67) y no se cae; al soltar shift se para (no queda agachado)
          xdotool keydown shift; xdotool keydown w; sleep 4; xdotool keyup w; sleep 0.3; import -window root cap/x3b_borde.png; echo "data get entity $N Pos" >> srv/cmds.txt; sleep 1
          xdotool keyup shift; sleep 1; echo "data get entity $N Pos" >> srv/cmds.txt; sleep 1; import -window root cap/x3c_parado.png
          grep -E "has the following entity data" srv/server.log | tail -2 || true
          echo "tod gravedad abajo $N" >> srv/cmds.txt; sleep 3; import -window root cap/x4_abajo.png
          # flecha: la pongo enfrente, le pego (clic izquierdo): gira, cambia la gravedad; la segunda vez esta gastada (roja, NG)
          echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt; echo "tod flecha crear 63.5 -59 0.5 -90" >> srv/cmds.txt; sleep 2.5; import -window root cap/y1_flecha.png
          xdotool mousemove 640 360 click 1; sleep 0.5; import -window root cap/y2_girando.png; sleep 1.5; import -window root cap/y3_cambio.png
          sleep 2; echo "tod flecha pegar f1 $N" >> srv/cmds.txt; sleep 1.5; import -window root cap/y4_desde_el_techo.png
          grep -E "flecha" srv/server.log | tail -6 || echo "NO LE PEGO A LA FLECHA"
          echo "tod gravedad abajo $N" >> srv/cmds.txt; echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt; sleep 3; import -window root cap/y5_roja.png
          # 18) gravedad de costado: pared al este, /tod gravedad este -> cae contra la pared, camina por la pared (W = para arriba), salta, tercera persona
          echo "tod flecha borrar f1" >> srv/cmds.txt; echo "fill 64 -61 -6 64 -55 6 stone" >> srv/cmds.txt; echo "tp $N 60.5 -60 0.5 -90 0" >> srv/cmds.txt; sleep 2
          echo "tod gravedad este $N" >> srv/cmds.txt; sleep 0.3; import -window root cap/z0_girando.png; sleep 3; import -window root cap/z1_pared.png
          echo "data get entity $N Pos" >> srv/cmds.txt; sleep 1
          echo "fill 63 -58 -1 63 -56 1 stone" >> srv/cmds.txt; sleep 0.5
          xdotool keydown w; sleep 1.2; xdotool keyup w; sleep 0.5; import -window root cap/z2_camino.png
          echo "data get entity $N Pos" >> srv/cmds.txt; sleep 1
          xdotool keydown space; sleep 0.2; xdotool keyup space; sleep 0.2; import -window root cap/z3_salto.png; sleep 1.5
          xdotool key F5; sleep 1.5; import -window root cap/z4_tercera.png; xdotool key F5; sleep 0.5; xdotool key F5; sleep 1
          xdotool key F5; sleep 1; xdotool keydown F3; xdotool key b; xdotool keyup F3; sleep 1; import -window root cap/z4b_cajas.png; xdotool keydown F3; xdotool key b; xdotool keyup F3; xdotool key F5; sleep 0.5; xdotool key F5; sleep 0.5
          xdotool keydown d; sleep 0.8; xdotool keyup d; sleep 0.5; echo "data get entity $N Pos" >> srv/cmds.txt; sleep 1
          grep -E "has the following entity data|Gravedad este" srv/server.log | tail -4 || true
          echo "tod gravedad abajo $N" >> srv/cmds.txt; sleep 3; import -window root cap/z5_vuelve.png
          grep -iE "moved wrongly|moved too quickly|Flying is not enabled|kicked" srv/server.log | tail -5 || true
          # flecha de costado: pared al norte; la flecha (fija, izquierda) mirando al este apunta a la izquierda (norte); le pego -> cae al norte
          echo "fill 64 -61 -6 64 -55 6 air" >> srv/cmds.txt; echo "fill 55 -61 -4 66 -55 -4 stone" >> srv/cmds.txt; echo "tp $N 60.5 -60 0.5 -90 10" >> srv/cmds.txt
          echo "tod flecha crear 63.5 -59 0.5 -90" >> srv/cmds.txt; sleep 1; echo "tod flecha config f2 fija izquierda" >> srv/cmds.txt; sleep 2; import -window root cap/z6_flecha_izquierda.png
          xdotool mousemove 640 360 click 1; sleep 0.25; import -window root cap/z7_girando.png; sleep 1; import -window root cap/z8_norte.png; sleep 2; xdotool key F5; sleep 1.5; import -window root cap/z9_norte_tercera.png; xdotool key F5; sleep 0.5; xdotool key F5; sleep 1
          grep -E "flecha f2|Flecha f2" srv/server.log | tail -3 || echo "NO LE PEGO A LA FLECHA f2"
          echo "data get entity $N Pos" >> srv/cmds.txt; sleep 1; grep -E "has the following entity data" srv/server.log | tail -1 || true
          echo "tod gravedad abajo $N" >> srv/cmds.txt; echo "tod flecha borrar f2" >> srv/cmds.txt; sleep 2
          # 19) orbes y pads: un pad amarillo (8 bloques), una orbe roja (12) y una amarilla; pisar el pad; saltar y apretar espacio en la orbe
          echo "tod salto crear pad amarilla 70 -60 0" >> srv/cmds.txt; echo "tod salto crear orbe roja 73 -59 0" >> srv/cmds.txt; echo "tod salto crear orbe amarilla 70 -57 3" >> srv/cmds.txt
          echo "tp $N 66.5 -60 1.5 -90 5" >> srv/cmds.txt; sleep 2.5; import -window root cap/o1_vista.png
          echo "tp $N 70.5 -60 0.5 -90 0" >> srv/cmds.txt; sleep 0.7; echo "data get entity $N Pos" >> srv/cmds.txt; sleep 4; echo "data get entity $N Health" >> srv/cmds.txt
          echo "tp $N 73.5 -60 0.5 -90 0" >> srv/cmds.txt; sleep 2; xdotool key space; sleep 0.12; xdotool key space; sleep 0.8; echo "data get entity $N Pos" >> srv/cmds.txt; import -window root cap/o2_orbe.png; sleep 4.5
          echo "data get entity $N Health" >> srv/cmds.txt; sleep 1
          grep -E " uso |Orbes y pads|Salto o|Salto p" srv/server.log | tail -8 || echo "NO SE USO NINGUN SALTO"
          grep -E "has the following entity data" srv/server.log | tail -4 || true
          echo "tod varita" >> srv/cmds.txt; sleep 1
          # 20) plataforma: 3x1x3 que sube 6 bloques en 3 s; me paro arriba: me tiene que llevar (sin que el server me eche)
          echo "tod plataforma crear 79 -60 9 79 -54 9 3" >> srv/cmds.txt; sleep 1.5; echo "tp $N 80.5 -59 10.5 -90 20" >> srv/cmds.txt; sleep 0.3; import -window root cap/p1_plataforma.png
          sleep 1.5; echo "data get entity $N Pos" >> srv/cmds.txt; import -window root cap/p2_subiendo.png; sleep 1.2; echo "data get entity $N Pos" >> srv/cmds.txt; sleep 0.4; import -window root cap/p3_arriba.png; sleep 2
          grep -E "has the following entity data|Plataforma|kicked|Kicked|flying" srv/server.log | tail -5 || true
          # 16) pantalla chica (como un monitor 1080p con la interfaz en Auto: 480x270): que nada se pise
          WID=$(xdotool search --name "Minecraft" | head -1); echo "ventana: $WID"; xdotool windowmove $WID 0 0; xdotool windowsize $WID 960 540; sleep 3
          xdotool mousemove 480 520; xdotool keydown j; sleep 0.15; xdotool keyup j; sleep 2
          xdotool mousemove 70 94 click 1; sleep 1; xdotool mousemove 224 150 click 1; sleep 1; xdotool mousemove 950 530; sleep 0.5; import -window root cap/s1_anuncios.png
          xdotool mousemove 70 158 click 1; sleep 1; xdotool mousemove 224 148 click 1; sleep 1; xdotool mousemove 950 530; sleep 0.5; import -window root cap/s2_crafteos.png
          xdotool mousemove 70 222 click 1; sleep 1; xdotool mousemove 950 530; sleep 0.5; import -window root cap/s3_items.png
          xdotool mousemove 70 286 click 1; sleep 1; xdotool mousemove 224 150 click 1; sleep 1; xdotool mousemove 950 530; sleep 0.5; import -window root cap/s4_misiones.png
          xdotool mousemove 520 184 click 1; sleep 1; import -window root cap/s5_selector.png; xdotool key Escape; sleep 0.5
          xdotool mousemove 882 42 click 1; sleep 1; xdotool mousemove 950 530; sleep 0.5; import -window root cap/s6_inicio.png
          xdotool mousemove 70 222 click 1; sleep 1; xdotool mousemove 950 530; sleep 0.5; import -window root cap/s7_misiones_jugador.png
          xdotool mousemove 70 286 click 1; sleep 1; xdotool mousemove 950 530; sleep 0.5; import -window root cap/s8_crafteos_jugador.png
          xdotool key Escape; sleep 1
          grep -iE "mision" srv/server.log | tail -12 || true
          grep -iE "crafteo|Crafteos" srv/server.log | tail -8 || true
          echo "tod estado" >> srv/cmds.txt; sleep 2
          pkill -f net.fabricmc || true; echo "stop" >> srv/cmds.txt; sleep 5
      - name: Subir capturas y logs
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r cap /tmp/out/ 2>/dev/null || true
          cp plugin.log juego.log /tmp/out/ 2>/dev/null || true; cp run/logs/latest.log /tmp/out/mc.log 2>/dev/null || true
          cp srv/server.log /tmp/out/server.log 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b log
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "sala $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" log:ci-sala-tod5
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tod5-plugin-servidor
          path: servidor/build/libs/*.jar
