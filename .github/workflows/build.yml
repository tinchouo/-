name: Compilar TOD4
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Compilar
        run: |
          set -o pipefail
          mvn -B package 2>&1 | tee build.log || {
            grep -E "\[ERROR\]" build.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with: { name: TOD4, path: target/TOD4.jar }
