name: Compilar TOD4
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Compilar
        run: |
          set -o pipefail
          mvn -B package 2>&1 | tee build.log || {
            grep -E "\[ERROR\]" build.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
      - name: Compilar TOD4Eventos
        run: |
          set -o pipefail
          mvn -B -f eventos/pom.xml package 2>&1 | tee build2.log || {
            grep -E "\[ERROR\]" build2.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
      - name: Compilar TOD4Mejoras
        run: |
          set -o pipefail
          mvn -B -f mejoras/pom.xml package 2>&1 | tee build3.log || {
            grep -E "\[ERROR\]" build3.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
      - name: Compilar TOD4Aether
        run: |
          set -o pipefail
          mvn -B -f aether/pom.xml package 2>&1 | tee build4.log || {
            grep -E "\[ERROR\]" build4.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with: { name: TOD4, path: target/TOD4.jar }
      - uses: actions/upload-artifact@v4
        with: { name: TOD4Aether, path: aether/target/TOD4Aether.jar }
      - uses: actions/upload-artifact@v4
        with: { name: TOD4Eventos, path: eventos/target/TOD4Eventos.jar }
      - uses: actions/upload-artifact@v4
        with: { name: TOD4Mejoras, path: mejoras/target/TOD4Mejoras.jar }
