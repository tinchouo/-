name: TOD5 prueba en el juego
on:
  push:
    branches: [tod5-menu]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Pantalla virtual
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-apps imagemagick xdotool mesa-utils libgl1-mesa-dri mesa-vulkan-drivers pulseaudio >/dev/null
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset & sleep 2
          DISPLAY=:99 glxinfo -B 2>&1 | head -12 | tee glx.txt || true
      - name: Abrir Minecraft y sacar capturas
        run: |
          mkdir -p run cap
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nguiScale:2\n' > run/options.txt
          pulseaudio --start --exit-idle-time=-1 || true
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          export DISPLAY=:99
          (env -u CI ./gradlew runClient --stacktrace > juego.log 2>&1 &)
          for i in $(seq 1 420); do grep -q "TOD5 menu abierto" run/logs/latest.log 2>/dev/null && break; grep -q "BUILD FAILED\|crash-reports" juego.log && break; sleep 1
            if [ $i = 25 ] || [ $i = 45 ]; then import -window root cap/carga_$i.png || true; fi
            if [ $i = 240 ]; then import -window root cap/trabado.png || true; P=$(pgrep -f "devlaunchinjector.Main" | head -1); [ -n "$P" ] && jstack $P > hilos.txt 2>&1 || true; fi
          done
          T0=$(date +%s.%N)
          for t in 0.3 2.5 4.0 4.5 5.0 6.5 8.0 12 17.5 20; do
            while [ $(echo "$(date +%s.%N) - $T0 < $t" | bc) = 1 ]; do sleep 0.05; done
            import -window root cap/t_$t.png || xwd -root -silent | convert xwd:- cap/t_$t.png
          done
          # mouse encima de JUGAR, despues entrar a Opciones y pasar el mouse por un boton de Minecraft
          xdotool mousemove 640 438; sleep 2; import -window root cap/hover_jugar.png
          xdotool mousemove 640 488; sleep 1; xdotool click 1; sleep 4; import -window root cap/opciones.png
          for y in 150 200 250 300 350; do xdotool mousemove 400 $y; sleep 1; import -window root cap/opciones_hover_$y.png; done
          xdotool key Escape; sleep 2; xdotool keydown F3 key t keyup F3; sleep 25; import -window root cap/despues_recarga.png
          pkill -f net.fabricmc || true; sleep 3
      - name: Subir capturas y logs
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r cap /tmp/out/ 2>/dev/null || true
          cp juego.log glx.txt hilos.txt /tmp/out/ 2>/dev/null || true; cp run/logs/latest.log /tmp/out/mc.log 2>/dev/null || true
          cp -r run/crash-reports /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b log
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "prueba $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" log:ci-prueba-tod5
