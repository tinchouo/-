name: TOD5 mod
on:
  push:
    branches: [tod5-menu]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: set -o pipefail; ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Fuentes de Minecraft (referencia)
        if: contains(github.event.head_commit.message, '[ref]')
        shell: bash {0}
        run: |
          W=$GITHUB_WORKSPACE; LOG=$W/ref.log
          ./gradlew genSources > /dev/null 2>&1
          J=$(find $W/.gradle -name 'minecraft-clientOnly-*-sources.jar' | head -1)
          C=$(find $W/.gradle -name 'minecraft-common-*-sources.jar' | head -1)
          echo "client: $J  common: $C" >> $LOG
          mkdir -p /tmp/ref && cd /tmp/ref
          unzip -q -o "$J" 'net/minecraft/client/*' >> $LOG 2>&1
          unzip -q -o "$C" 'net/minecraft/network/*' 'net/minecraft/sounds/*' >> $LOG 2>&1
          FA=$(find ~/.gradle -name 'fabric-api-0*.jar' ! -name '*sources*' | head -1); echo "fabric-api: $FA" >> $LOG
          mkdir -p /tmp/fa && cd /tmp/fa && unzip -q -o "$FA" 'META-INF/jars/*' >> $LOG 2>&1
          for n in networking-api-v1 lifecycle-events-v1 key-mapping-api-v1 key-binding-api-v1 rendering-v1; do
            NJ=$(ls META-INF/jars/ | grep "fabric-$n" | head -1); echo "jar $n: $NJ" >> $LOG; [ -z "$NJ" ] && continue
            mkdir -p x_$n && (cd x_$n && unzip -q -o ../META-INF/jars/$NJ)
            for c in $(cd x_$n && find . -path '*/api/*' -name '*.class'); do
              cl=$(echo $c | sed 's#^\./##; s#\.class$##; s#/#.#g'); echo "== $cl" >> $LOG; javap -cp x_$n -public "$cl" >> $LOG 2>&1
            done
          done
          echo "archivos ref: $(find /tmp/ref -type f | wc -l)" >> $LOG
          true
      - name: Subir log y referencia
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.log ref.log /tmp/out/ 2>/dev/null || true; cp build.log /tmp/out/ 2>/dev/null || true
          [ -d /tmp/ref ] && cp -r /tmp/ref /tmp/out/src || true
          cd /tmp/out && git init -q && git checkout -q -b log
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "tod5 $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" log:ci-logs-tod5
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tod5-mod
          path: build/libs/*.jar
