name: TOD5 mod
on:
  push:
    branches: [tod5-menu]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Fuentes de Minecraft (referencia)
        if: contains(github.event.head_commit.message, '[ref]')
        run: |
          (./gradlew tasks --all | grep -i -E "gensources|decompile" ; ./gradlew genSources --stacktrace | tail -30) > ref.log 2>&1 || true
          find ~/.gradle .gradle build -name '*.jar' 2>/dev/null | grep -i -E 'minecraft|sources' | head -40 >> ref.log
          J=""
          for f in $(find ~/.gradle .gradle -name '*sources*.jar' 2>/dev/null); do if unzip -l "$f" 2>/dev/null | grep -q 'client/gui/screens/TitleScreen.java'; then J="$f"; break; fi; done
          echo "jar: $J" >> ref.log
          J=$(realpath "$J"); C=$(realpath $(find .gradle -name 'minecraft-common-*-sources.jar' | head -1))
          mkdir -p /tmp/ref && cd /tmp/ref
          unzip -q -o "$J" 'net/minecraft/client/gui/*' 'net/minecraft/client/renderer/CubeMap*' 'net/minecraft/client/renderer/Panorama*' 'net/minecraft/client/renderer/RenderPipelines*' 'net/minecraft/client/Minecraft.java' 'net/minecraft/client/sounds/*' 'net/minecraft/client/resources/sounds/*' 'net/minecraft/client/multiplayer/resolver/*' 'net/minecraft/client/multiplayer/ServerData.java' 'net/minecraft/client/Options.java' 'net/minecraft/client/renderer/texture/CubeMapTexture.java' 'net/minecraft/client/renderer/GameRenderer.java' 'net/minecraft/client/gui/render/*' >> $GITHUB_WORKSPACE/ref.log 2>&1 || true
          CJ=$(realpath $(find .gradle -name 'minecraft-clientOnly-*-26.3.jar' ! -name '*sources*' | head -1)); unzip -q -o "$CJ" 'assets/minecraft/shaders/core/panorama*' 'assets/minecraft/shaders/include/*' >> $GITHUB_WORKSPACE/ref.log 2>&1 || true
          for jj in $(find ~/.gradle -name 'fabric-networking-api-v1-*-sources.jar' -o -name 'fabric-lifecycle-events-v1-*-sources.jar' | head -4); do unzip -q -o "$jj" 'net/*' >> $GITHUB_WORKSPACE/ref.log 2>&1 || true; done
          FA=$(find ~/.gradle -name 'fabric-api-0*.jar' ! -name '*sources*' | head -1); echo "fabric-api: $FA" >> $GITHUB_WORKSPACE/ref.log
          mkdir -p /tmp/fa && cd /tmp/fa && unzip -q -o "$FA" 'META-INF/jars/*' || true
          for n in networking-api-v1 lifecycle-events-v1; do NJ=$(ls META-INF/jars/ | grep "fabric-$n" | head -1); mkdir -p x_$n && (cd x_$n && unzip -q -o ../META-INF/jars/$NJ) || true; done
          for c in $(cd /tmp/fa && find x_* -name '*.class' | grep -E '/api/' | grep -v '\$' ); do echo "== $c" >> $GITHUB_WORKSPACE/ref.log; javap -cp $(dirname $c | cut -d/ -f1) -public $(echo $c | cut -d/ -f2- | sed 's/\.class$//; s#/#.#g') >> $GITHUB_WORKSPACE/ref.log 2>&1 || true; done
          cd /tmp/ref
          unzip -q -o "$C" 'net/minecraft/network/protocol/common/custom/*' 'net/minecraft/network/codec/*' 'net/minecraft/network/FriendlyByteBuf.java' 'net/minecraft/network/RegistryFriendlyByteBuf.java' >> $GITHUB_WORKSPACE/ref.log 2>&1 || true
          unzip -q -o "$C" 'net/minecraft/sounds/*' 'net/minecraft/network/chat/Component.java' >> $GITHUB_WORKSPACE/ref.log 2>&1 || true
          find /tmp/ref -type f | wc -l >> $GITHUB_WORKSPACE/ref.log
      - name: Subir log y referencia
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.log ref.log /tmp/out/ 2>/dev/null || true; cp build.log /tmp/out/ 2>/dev/null || true
          [ -d /tmp/ref ] && cp -r /tmp/ref /tmp/out/src || true
          cd /tmp/out && git init -q && git checkout -q -b log
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "tod5 $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" log:ci-logs-tod5
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tod5-mod
          path: build/libs/*.jar
