name: Sacar texturas de Minecraft
on:
  push:
    paths: ['.github/workflows/texturas.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sacar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el cliente 1.21.4 y sacar texturas
        run: |
          V=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="1.21.4") | .url')
          C=$(curl -s "$V" | jq -r '.downloads.client.url')
          curl -sL -o client.jar "$C"
          mkdir -p out && cd out
          unzip -q -o ../client.jar 'assets/minecraft/textures/item/*' 'assets/minecraft/textures/block/deepslate*' 'assets/minecraft/textures/block/tuff*' 'assets/minecraft/textures/block/blackstone*' 'assets/minecraft/textures/block/stone.png' 'assets/minecraft/textures/block/*_ore.png'
          git init -q && git checkout -q -b ci-texturas
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m texturas
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-texturas:ci-texturas
