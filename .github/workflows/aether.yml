name: Probar TOD4Aether
on:
  push:
    paths: ['aether/**', 'eventos/**', 'src/**', '.github/workflows/aether.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Compilar
        run: |
          mvn -B -q package
          mvn -B -q -f aether/pom.xml package
          mvn -B -q -f eventos/pom.xml package
      - name: Bajar Paper 1.21.4
        run: |
          mkdir -p srv/plugins srv/plugins/TOD4 && cd srv
          J=$(curl -s -H "User-Agent: tod4-ci" https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds)
          URL=$(echo "$J" | jq -r 'max_by(.id) | .downloads."server:default".url')
          curl -sL -o paper.jar "$URL"
          cp ../target/TOD4.jar ../aether/target/TOD4Aether.jar ../eventos/target/TOD4Eventos.jar plugins/
          # un aether.yml viejo en plugins/TOD4: se tiene que copiar solo a plugins/TOD4Aether
          cp ../aether/src/main/resources/aether.yml plugins/TOD4/aether.yml
          # misiones con el sistema viejo (una opcional activa con progreso): tiene que pasar a la lista
          printf 'misiones:\n  "5":\n    nombre: Dia 5\n    clase: dia\n    objetivos: []\n  op7:\n    nombre: Dia 7\n    clase: op\n    objetivos: []\nactiva:\n  dia: "5"\n  op: op7\nprog:\n  op:\n    11111111-1111-1111-1111-111111111111:\n      abc:\n        m0: 3\nreclamo:\n  op:\n    22222222-2222-2222-2222-222222222222: true\n' > plugins/TOD4/misiones.yml
          echo "eula=true" > eula.txt
          printf "online-mode=false\nspawn-protection=0\n" > server.properties
      - name: Arrancar
        run: |
          cd srv
          (sleep 100; for c in "tod4:aether_mesa" "tod4:aether_mobs" "tod4:aether_aire" "tod4:aether_caida" "tod4:aether_loot ver tier4" "tod4:aether_recargar" "tod4 recargar" "tod4:cambios" "time set 13000" "tod4:aether_reset status" "tod4eventos:agujero crear" esperar "tod4eventos:agujero estado" "tod4eventos:agujero abrir" esperar esperar "tod4eventos:agujero foto" esperar esperar "tod4eventos:agujero cerrar 1" "tod4eventos:agujero limpiar" esperar "tod4:alucinar" "tod4:alucinar nadie 5" "tod4:video nadie screamer" "tod4 corazon amarillo nadie" "tod4 corazon morado" "tod4eventos:agujero abrir" esperar esperar "tod4eventos:agujero estado"; do if [ "$c" = esperar ]; then sleep 10; continue; fi; echo "$c"; sleep 2; done; echo stop) | timeout 400 java -Xmx2G -jar paper.jar --nogui > log.txt 2>&1 || true
          M=$(grep -iE -A8 "Exception|TOD4|Aether|aether" log.txt | grep -v "Downloading\|Loading library" | head -150 | tr '\n' '#')
          echo "::warning::${M//%/%25}"
          grep -q "Done (" log.txt || { tail -40 log.txt | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; exit 1; }
          ls -la plugins/TOD4Aether | tr '\n' '#' | xargs -0 -I{} echo "::notice::{}"
          if grep -qiE "Exception|Unknown command" log.txt; then echo "::error::Hay errores"; exit 1; fi
          echo "::notice::misiones.yml despues: $(tr '\n' '#' < plugins/TOD4/misiones.yml)"
          grep -q "op_op7" plugins/TOD4/misiones.yml && grep -q "m0: 3" plugins/TOD4/misiones.yml || { echo "::error::La opcional vieja no paso a la lista"; exit 1; }
          grep -q "zombie_alucinado" plugins/TOD4Eventos/agujero.yml || { echo "::error::Falta zombie_alucinado en agujero.yml"; exit 1; }
          echo "::notice::Arranco sin errores"
      - name: Guardar el log en la rama ci-logs
        if: always()
        run: |
          mkdir /tmp/l && cp srv/log.txt /tmp/l/aether_log.txt || true
          cd /tmp/l && git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@local
          git add . && git commit -q -m "log $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
