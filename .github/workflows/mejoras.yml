name: Probar mejoras
on:
  push:
    paths: ['mejoras/**', '.github/workflows/mejoras.yml']
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Compilar
        run: mvn -B -q -f mejoras/pom.xml package
      - name: Bajar Paper 1.21.4
        run: |
          mkdir -p srv/plugins && cd srv
          J=$(curl -s -H "User-Agent: tod4-ci" https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds)
          URL=$(echo "$J" | jq -r 'max_by(.id) | .downloads."server:default".url')
          curl -sL -o paper.jar "$URL"
          cp ../mejoras/target/TOD4Mejoras.jar plugins/
          echo "eula=true" > eula.txt
          printf "online-mode=false\nspawn-protection=0\n" > server.properties
      - name: Arrancar
        run: |
          cd srv
          (sleep 90; echo "mejoras"; sleep 2; echo "mejoras recargar"; sleep 2; echo "minecraft:recipe give @a *"; sleep 2; echo stop) | timeout 240 java -Xmx2G -jar paper.jar --nogui > log.txt 2>&1 || true
          M=$(grep -iE -A6 "Exception|TOD4Mejoras|mejora" log.txt | grep -v "Downloading\|Loading library" | head -120 | tr '\n' '#')
          echo "::warning::${M//%/%25}"
          grep -q "Done (" log.txt || { tail -40 log.txt | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; exit 1; }
          if grep -qiE "Exception|WARN\]: \[TOD4Mejoras\]" log.txt; then echo "::error::Hay errores o avisos"; exit 1; fi
          echo "::notice::Arranco sin errores"
